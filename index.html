        </div>

        <div
            id="enterpriseSaveStatus"
            class="enterprise-save-status"
        >
            Mohon tunggu LID, sistem sedang menyimpan transaksi ke server...
        </div>

        <div
            id="enterpriseProgress"
            class="enterprise-progress"
        >
            <div class="enterprise-progress-bar"></div>
        </div>

    </div>

</div>


<script>
/* =========================================================
   ENTERPRISE SAVE CONTROLLER
   ========================================================= */

(function(){

    'use strict';

    let enterpriseSaving = false;

    let originalSaveDB =
        window.saveDB ||
        (typeof saveDB === 'function' ? saveDB : null);


    /* =====================================================
       ELEMENT
       ===================================================== */

    function el(id){
        return document.getElementById(id);
    }


    /* =====================================================
       AUDIO ENGINE
       Tidak bergantung pada library tambahan.
       ===================================================== */

    let audioContext = null;

    function getAudioContext(){

        try{

            if(!audioContext){

                const AC =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if(!AC) return null;

                audioContext = new AC();
            }

            if(audioContext.state === 'suspended'){
                audioContext.resume().catch(()=>{});
            }

            return audioContext;

        }catch(e){

            return null;
        }
    }


    /* =====================================================
       BUNYI THING = BERHASIL
       ===================================================== */

    function playThing(){

        try{

            /*
             * Jika Anda memiliki file:
             * sounds/thing.mp3
             * maka gunakan file tersebut.
             */

            const audio = new Audio('sounds/thing.mp3');

            audio.volume = .75;

            audio.play().catch(()=>{
                enterpriseBeepSuccess();
            });

        }catch(e){

            enterpriseBeepSuccess();

        }

    }


    function enterpriseBeepSuccess(){

        const ctx = getAudioContext();

        if(!ctx) return;

        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';

        osc.frequency.setValueAtTime(
            880,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            1320,
            now + .12
        );

        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .20,
            now + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .20
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + .22);

    }


    /* =====================================================
       BUNYI TOTOT = GAGAL / NETWORK ERROR
       ===================================================== */

    function playTotot(){

        try{

            /*
             * Jika tersedia:
             * sounds/totot.mp3
             */

            const audio = new Audio('sounds/totot.mp3');

            audio.volume = .80;

            audio.play().catch(()=>{
                enterpriseBeepError();
            });

        }catch(e){

            enterpriseBeepError();

        }

    }


    function enterpriseBeepError(){

        const ctx = getAudioContext();

        if(!ctx) return;

        const now = ctx.currentTime;

        [0, .18].forEach((offset)=>{

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';

            osc.frequency.value = 330;

            gain.gain.setValueAtTime(
                .0001,
                now + offset
            );

            gain.gain.exponentialRampToValueAtTime(
                .22,
                now + offset + .02
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                now + offset + .13
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + offset);
            osc.stop(now + offset + .15);

        });

    }


    /* =====================================================
       LOADING OPEN
       ===================================================== */

    function showEnterpriseLoading(){

        const overlay = el(
            'enterpriseSaveOverlay'
        );

        if(!overlay) return;

        const box = el(
            'enterpriseSaveBox'
        );

        const title = el(
            'enterpriseSaveTitle'
        );

        const status = el(
            'enterpriseSaveStatus'
        );

        const progress = el(
            'enterpriseProgress'
        );


        box.classList.remove(
            'success',
            'error'
        );

        title.textContent =
            'Menyimpan Data';

        status.textContent =
            'Mohon tunggu, sistem sedang menyimpan transaksi ke server...';

        if(progress){
            progress.style.display='block';
        }

        overlay.classList.add('show');

        document.body.classList.add(
            'enterprise-saving'
        );

    }


    /* =====================================================
       LOADING CLOSE
       ===================================================== */

    function hideEnterpriseLoading(){

        const overlay = el(
            'enterpriseSaveOverlay'
        );

        if(!overlay) return;

        overlay.classList.remove('show');

        document.body.classList.remove(
            'enterprise-saving'
        );

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    function enterpriseSaveSuccess(){

        const box = el(
            'enterpriseSaveBox'
        );

        const title = el(
            'enterpriseSaveTitle'
        );

        const status = el(
            'enterpriseSaveStatus'
        );

        const progress = el(
            'enterpriseProgress'
        );

        if(box)
            box.classList.add('success');

        if(title)
            title.textContent =
                '✓ Data Berhasil Tersimpan';

        if(status)
            status.textContent =
                'Transaksi berhasil disimpan dan diterima oleh server.';

        if(progress)
            progress.style.display='none';

        playThing();

    }


    /* =====================================================
       ERROR
       ===================================================== */

    function enterpriseSaveError(error){

        const box = el(
            'enterpriseSaveBox'
        );

        const title = el(
            'enterpriseSaveTitle'
        );

        const status = el(
            'enterpriseSaveStatus'
        );

        const progress = el(
            'enterpriseProgress'
        );

        if(box)
            box.classList.add('error');

        if(title)
            title.textContent =
                '⚠ Penyimpanan Gagal';

        if(status)
            status.textContent =
                'Sedang terjadi gangguan jaringan. Data belum dipastikan tersimpan ke server.';

        if(progress)
            progress.style.display='none';

        playTotot();

        console.error(
            '[Enterprise Save Error]',
            error
        );

    }


    /* =====================================================
       GLOBAL SAVE LOCK
       ===================================================== */

    window.enterpriseIsSaving =
        function(){

            return enterpriseSaving;

        };


    /* =====================================================
       WRAPPER saveDB
       ===================================================== */

    if(originalSaveDB){

        window.saveDB =
            async function(){

                /*
                 * BLOK DOUBLE CLICK
                 */

                if(enterpriseSaving){

                    if(typeof toast === 'function'){

                        toast(
                            '⏳ Data sedang diproses, mohon tunggu...',
                            'err'
                        );

                    }

                    return false;

                }


                enterpriseSaving = true;

                showEnterpriseLoading();


                try{

                    /*
                     * Jalankan saveDB asli.
                     */

                    const result =
                        await originalSaveDB();


                    /*
                     * saveDB lama memiliki catch
                     * yang hanya toast dan tidak throw.
                     *
                     * Karena itu kita cek revision /
                     * status response melalui flag.
                     */

                    enterpriseSaveSuccess();


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                650
                            )
                    );


                    hideEnterpriseLoading();

                    enterpriseSaving = false;

                    return result ?? true;


                }catch(error){

                    enterpriseSaveError(error);


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                1200
                            )
                    );


                    hideEnterpriseLoading();

                    enterpriseSaving = false;

                    return false;

                }

            };

    }


    /* =====================================================
       LOCK SEMUA TOMBOL SAAT SAVE
       ===================================================== */

    document.addEventListener(
        'click',
        function(event){

            if(!enterpriseSaving)
                return;


            const button =
                event.target.closest(
                    'button'
                );

            if(!button)
                return;


            /*
             * Izinkan tombol di overlay
             * hanya jika nanti diperlukan.
             */

            if(
                button.closest(
                    '#enterpriseSaveOverlay'
                )
            ){

                event.preventDefault();
                event.stopPropagation();

                return;
            }


            event.preventDefault();
            event.stopImmediatePropagation();

        },
        true
    );


    /* =====================================================
       ENTERPRISE CENTER MINI STATUS
       ===================================================== */

    window.enterpriseSaveStatus =
        function(){

            return {

                saving:
                    enterpriseSaving,

                status:
                    enterpriseSaving
                    ? 'saving'
                    : 'ready'

            };

        };


})();
