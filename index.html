<script id="erpSecurityPatch">
/* ================================================================
   ERP SECURITY / AUDIT / PROFILE / NOTIFICATION PATCH v2
   - Hak akses Owner per akun
   - Route guard: menu tidak boleh dibuka jika tidak diizinkan
   - Audit trail otomatis untuk tambah/edit/hapus
   - Nama akun + jabatan + foto PNG
   - Notifikasi unread bersifat PER AKUN dan baru hilang setelah diklik
================================================================ */
(function(){
  const ADMIN_USERS=['fitri','riska','orhan','siti','abah'];
  const AUDIT_SKIP=new Set(['users','auditLog','notifications','notificationReads']);
  const deepClone=o=>{try{return JSON.parse(JSON.stringify(o));}catch(e){return o;}};
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function ensureSecurityDB(){
    if(!DB) return;
    DB.auditLog=Array.isArray(DB.auditLog)?DB.auditLog:[];
    DB.notifications=Array.isArray(DB.notifications)?DB.notifications:[];
    DB.notificationReads=DB.notificationReads&&typeof DB.notificationReads==='object'?DB.notificationReads:{};
    if(!DB.users) DB.users={};
    const defaults={
      fitri:{password:'Sukses123',role:'admin',name:'Fitri',jabatan:'Admin'},
      riska:{password:'Sukses123',role:'admin',name:'Riska',jabatan:'Admin'},
      orhan:{password:'Sukses123',role:'admin',name:'Orhan',jabatan:'Komisaris'},
      siti:{password:'Sukses123',role:'admin',name:'Siti',jabatan:'Admin'},
      abah:{password:'Sukses123',role:'admin',name:'Abah',jabatan:'Admin'},
      owner:{password:'Owner@2026',role:'master',name:'ANDI RAHMAN S.Pi',jabatan:'Direktur / Owner'}
    };
    Object.keys(defaults).forEach(u=>{
      if(!DB.users[u]) DB.users[u]=deepClone(defaults[u]);
      const d=defaults[u], r=DB.users[u];
      if(!r.name) r.name=d.name; if(!r.jabatan) r.jabatan=d.jabatan;
      if(!('photo' in r)) r.photo='';
      if(r.role!=='master' && !('permissions' in r)) r.permissions=null;
      if(!DB.notificationReads[u]) DB.notificationReads[u]={};
    });
  }
  ensureSecurityDB();

  function userLabel(u){const r=DB.users[u]||{};return r.jabatan||r.position||r.name||u||'Sistem';}
  function userRole(u){const r=DB.users[u]||{};return r.jabatan||r.role||'User';}
  function actor(){return {username:session&&session.user||APP_USER||'system',name:session&&session.name||userLabel(session&&session.user||APP_USER),role:session&&session.role||APP_ROLE||'system'};}
  function auditId(){return 'AUD-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
  function notifyId(){return 'NTF-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
  function recordKey(coll,id,kind){return [kind||'change',coll,id].join(':');}
  function addNotification(recipient,type,title,text,page,key,actorInfo){
    ensureSecurityDB();
    const n={id:notifyId(),recipient:recipient,type,title,text,page:page||'riwayat',key:key||notifyId(),createdAt:Date.now(),createdBy:actorInfo&&actorInfo.username||'system'};
    DB.notifications.push(n); return n;
  }
  function addAudit(action,coll,id,before,after,extra){
    ensureSecurityDB(); const a=actor();
    const rec={id:auditId(),timestamp:new Date().toISOString(),action,collection:coll,recordId:id||null,username:a.username,nama:a.name,jabatan:userRole(a.username),before:before?deepClone(before):null,after:after?deepClone(after):null};
    if(extra) Object.assign(rec,extra); DB.auditLog.push(rec); return rec;
  }

  /* Snapshot digunakan untuk menangkap perubahan dari fungsi transaksi lama tanpa harus menulis ulang semua modul. */
  let auditSnapshot=deepClone(DB);
  const originalSaveDB=saveDB;
  saveDB=async function(){
    ensureSecurityDB();
    const before=auditSnapshot||{}; const a=actor();
    const collections=Object.keys(DB).filter(k=>!AUDIT_SKIP.has(k));
    const changed=[];
    collections.forEach(coll=>{
      const oldV=before[coll], newV=DB[coll];
      if(!Array.isArray(newV)) return;
      const oldArr=Array.isArray(oldV)?oldV:[];
      const oldMap=new Map(oldArr.map(x=>[x&&x.id, x]));
      const newMap=new Map(newV.map(x=>[x&&x.id, x]));
      newV.forEach(x=>{
        if(!x||!x.id) return;
        const old=oldMap.get(x.id);
        if(!old){
          if(!x.dibuatOleh) x.dibuatOleh=a.username;
          if(!x.dibuatOlehNama) x.dibuatOlehNama=a.name;
          if(!x.dibuatPada) x.dibuatPada=new Date().toISOString();
          x.diubahOleh=a.username; x.diubahOlehNama=a.name; x.diubahPada=new Date().toISOString();
          addAudit('CREATE',coll,x.id,null,x);
          changed.push({coll,id:x.id,action:'CREATE',item:x});
        }else if(JSON.stringify(old)!==JSON.stringify(x)){
          x.diubahOleh=a.username; x.diubahOlehNama=a.name; x.diubahPada=new Date().toISOString();
          addAudit('UPDATE',coll,x.id,old,x);
          changed.push({coll,id:x.id,action:'UPDATE',item:x});
        }
      });
      oldArr.forEach(old=>{
        if(!old||!old.id||newMap.has(old.id)) return;
        addAudit('DELETE',coll,old.id,old,null); changed.push({coll,id:old.id,action:'DELETE',item:old});
      });
    });
    /* Setiap perubahan data diberi notifikasi ke setiap akun secara independen. */
    const recipients=Object.keys(DB.users).filter(u=>DB.users[u] && (DB.users[u].role==='admin'||DB.users[u].role==='master'));
    changed.filter(c=>!['auditLog','notifications','notificationReads','users'].includes(c.coll)).slice(0,100).forEach(c=>{
      const nm=(c.item&&(c.item.mitraNama||c.item.nama||c.item.keterangan||c.item.produkJadiNama))||c.id;
      const title=c.action==='CREATE'?'Transaksi/Data Baru':c.action==='UPDATE'?'Perubahan Data':'Data Dihapus';
      const text=`${title}: ${nm} — dilakukan oleh ${a.name}`;
      const key=recordKey(c.coll,c.id,c.action);
      recipients.forEach(u=>addNotification(u,'audit',title,text,'riwayat',key,a));
    });
    const ok=await originalSaveDB();
    auditSnapshot=deepClone(DB);
    try{ if(typeof refreshNotifUI==='function') refreshNotifUI(); }catch(e){}
    return ok;
  };

  /* Hak akses: NULL = akses default lama, [] = benar-benar tidak boleh mengakses menu apa pun. */
  const originalIsMenuAllowed=isMenuAllowed;
  isMenuAllowed=function(id){
    const it=NAV.flatMap(g=>g.items).find(x=>x.id===id);
    if(it&&it.masterOnly&&session.role!=='master') return false;
    if(session.role==='master') return true;
    const rec=DB.users[session.user];
    if(!rec) return false;
    if(Array.isArray(rec.permissions)) return rec.permissions.includes(id);
    return originalIsMenuAllowed(id);
  };
  const originalGoPage=goPage;
  goPage=function(id){
    if(!isMenuAllowed(id)){toast('Akses ditolak. Menu ini tidak diizinkan Owner untuk akun '+userLabel(session.user),'err');return;}
    return originalGoPage(id);
  };

  function applyProfile(){
    ensureSecurityDB(); const u=session&&session.user; const rec=DB.users[u]; if(!rec) return;
    const brand=document.querySelector('.side-brand');
    if(brand){
      const initials=(rec.name||u||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
      const photo=rec.photo?`<img class="profile-photo" src="${rec.photo}" alt="Foto ${safe(rec.name)}">`:`<div class="profile-photo placeholder">${safe(initials)}</div>`;
      brand.innerHTML=`<div class="profile-box">${photo}<div class="profile-name">${safe(rec.name||u)}</div><div class="profile-role">${safe(rec.jabatan||rec.role)}</div></div>`;
      brand.style.justifyContent='center'; brand.style.padding='16px 12px';
    }
    const rl=document.getElementById('roleLabel'); if(rl) rl.textContent=rec.name||u;
    const rt=document.getElementById('roleTag'); if(rt){rt.textContent=rec.jabatan||((rec.role==='master')?'OWNER':'ADMIN');}
  }

  /* Ganti buildNav agar permission benar-benar menjadi sumber tampilan navigasi. */
  const originalBuildNav=buildNav;
  buildNav=function(){
    ensureSecurityDB(); const el=document.getElementById('navScroll'); if(!el) return originalBuildNav();
    let html=''; const rec=DB.users[session.user]||{}; const perm=Array.isArray(rec.permissions)?rec.permissions:null;
    NAV.forEach(g=>{
      const items=g.items.filter(it=>{
        if(it.masterOnly) return session.role==='master';
        return session.role==='master'||!perm||perm.includes(it.id);
      });
      if(!items.length)return;
      html+=`<div class="nav-group-label">${safe(g.group)}</div>`;
      items.forEach(it=>{
        let badge='';
        if(it.badge&&pendingCount()>0) badge=`<span class="nav-badge">${pendingCount()}</span>`;
        if(it.badgeFn&&notifBadgeCount()>0) badge=`<span class="nav-badge">${notifBadgeCount()}</span>`;
        html+=`<div class="nav-item" data-page="${safe(it.id)}" onclick="goPage('${it.id}')"><span class="ic">${it.ic}</span>${safe(it.label)}${badge}</div>`;
      });
    });
    el.innerHTML=html; markActiveNav(); refreshNotifUI(); applyProfile();
  };

  /* Notifikasi per akun: dibaca hanya oleh akun yang mengkliknya. */
  function isRead(u,key){ensureSecurityDB();return !!(DB.notificationReads[u]&&DB.notificationReads[u][key]);}
  function markReadForUser(key){ensureSecurityDB();const u=session.user;if(!u)return;if(!DB.notificationReads[u])DB.notificationReads[u]={};DB.notificationReads[u][key]=Date.now();}
  const originalGetNotifItems=getNotifItems;
  getNotifItems=function(){
    const base=originalGetNotifItems(); ensureSecurityDB();
    const out=[];
    base.forEach(n=>{
      n.key=n.key||recordKey(n.type,n.id,'NOTIF'); n.recipient=session.user;
      if(!isRead(session.user,n.key)) out.push(n);
    });
    DB.notifications.filter(n=>n.recipient===session.user).forEach(n=>{
      if(isRead(session.user,n.key))return;
      out.push({type:n.type,id:n.id,key:n.key,text:n.text,page:n.page,title:n.title,createdAt:n.createdAt});
    });
    return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  };
  notifBadgeCount=function(){return getNotifItems().length;};
  renderNotifPanel=function(){
    const p=document.getElementById('notifPanel'); if(!p)return;
    const items=getNotifItems();
    if(!items.length){p.innerHTML='<div class="notif-empty">Tidak ada notifikasi baru.</div>';return;}
    const labelFor=n=>n.title||(n.type==='pengajuan'?'Pengajuan baru menunggu persetujuan':n.type==='pesan'?'Pesan dari Owner':n.type==='tagihan'?'Pengingat Jatuh Tempo':'Notifikasi Sistem');
    p.innerHTML=items.map(n=>`<div class="notif-item unread" onclick="openUnreadNotification('${String(n.key).replace(/'/g,"\\'")}','${String(n.page||'riwayat').replace(/'/g,"\\'")}')"><b>${safe(labelFor(n))}</b><div>${safe(n.text||'')}</div><small>Klik untuk membuka dan menandai sudah dibaca</small></div>`).join('');
  };
  openUnreadNotification=async function(key,page){markReadForUser(key);await saveDB();closeNotifPanel();buildNav();goPage(page||'riwayat');};
  markNotifRead=async function(){
    const items=getNotifItems();items.forEach(n=>markReadForUser(n.key));await saveDB();buildNav();refreshNotifUI();
  };

  /* Owner: satu layar pengaturan untuk 5 akun admin + password + foto PNG + hak akses. */
  renderPengaturan=function(){
    if(session.role!=='master') return guardMaster(); ensureSecurityDB();
    const allNavs=NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly);
    const daftarAdmin=[['fitri','Fitri'],['riska','Riska'],['orhan','Orhan'],['siti','Siti'],['abah','Abah']];
    const userCard=(username,label)=>{
      const user=DB.users[username]||{}; const active=Array.isArray(user.permissions)?user.permissions:allNavs.map(i=>i.id);
      const checks=allNavs.map(it=>`<label class="checkbox-item"><input type="checkbox" id="chk_${username}_${it.id}" ${active.includes(it.id)?'checked':''}> ${safe(it.label)}</label>`).join('');
      const photo=user.photo?`<img class="profile-photo" src="${user.photo}" alt="Foto ${safe(label)}">`:'<div class="profile-photo placeholder">'+safe((label[0]||'?').toUpperCase())+'</div>';
      return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Hak Akses ${safe(label)} <span class="tag tag-green">${safe(username)}</span></h3><div class="desc">Menu yang tidak dicentang akan hilang dari navigasi dan tidak dapat dibuka.</div></div></div><div class="form-grid" style="align-items:center"><div style="display:flex;align-items:center;gap:12px">${photo}<div><b>${safe(user.name||label)}</b><div class="profile-role" style="color:var(--ink-soft);text-align:left">${safe(user.jabatan||'Admin')}</div></div></div><div class="form-field"><label>Password Baru</label><input id="p_${username}" type="password" placeholder="Kosongkan jika tidak diubah"></div><div class="form-field"><label>Jabatan</label><input id="j_${username}" value="${safe(user.jabatan||'Admin')}" /></div><div class="form-field"><label>Foto Profil PNG</label><input id="photo_${username}" type="file" accept="image/png,.png"></div></div><div class="checkbox-grid">${checks}</div></div>`;
    };
    return `<div class="card"><div class="card-head"><div><h3>Owner — Pengguna, Password, Foto &amp; Hak Akses</h3><div class="desc">Owner mengatur akun Fitri, Riska, Orhan, Siti dan Abah secara terpisah. Perubahan tersimpan ke database ERP yang sama.</div></div></div><div class="form-grid">${daftarAdmin.map(([u,l])=>`<div class="form-field"><label>Username ${safe(l)}</label><input value="${safe(u)}" readonly></div>`).join('')}</div></div>${daftarAdmin.map(([u,l])=>userCard(u,l)).join('')}<div style="margin-top:16px"><button class="btn btn-em" onclick="simpanPengaturan()">Simpan Semua Pengaturan Owner</button></div>`;
  };
  simpanPengaturan=async function(){
    if(session.role!=='master'){toast('Hanya Owner yang dapat mengubah hak akses','err');return;}
    ensureSecurityDB(); const allNavs=NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly); const admins=ADMIN_USERS;
    for(const u of admins){
      const rec=DB.users[u]; const old=deepClone(rec); const p=val('p_'+u); if(p)rec.password=p;
      rec.jabatan=val('j_'+u)||rec.jabatan||'Admin';
      rec.permissions=allNavs.filter(it=>{const c=document.getElementById('chk_'+u+'_'+it.id);return c&&c.checked;}).map(it=>it.id);
      const f=document.getElementById('photo_'+u);
      if(f&&f.files&&f.files[0]){
        const file=f.files[0]; if(file.type!=='image/png'){toast('Foto '+u+' harus PNG','err');return;}
        rec.photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
      }
      if(JSON.stringify(old)!==JSON.stringify(rec)){
        addAudit('UPDATE','users',u,old,rec,{targetAccount:u});
      }
    }
    await saveDB(); toast('Hak akses, password, jabatan dan foto berhasil disimpan','ok'); buildNav(); render();
    admins.forEach(u=>{const p=document.getElementById('p_'+u);if(p)p.value='';});
  };

  /* Riwayat menampilkan siapa yang membuat/mengubah transaksi. */
  renderRiwayat=function(){
    const all=[
      ...DB.penjualan.map(t=>({...t,_jenis:'Penjualan',_ket:t.mitraNama,_nilai:t.total})),
      ...DB.pembelian.map(t=>({...t,_jenis:'Pembelian',_ket:t.mitraNama,_nilai:t.total})),
      ...DB.kasbank.map(t=>({...t,_jenis:'Kas/Bank',_ket:t.keterangan,_nilai:t.jumlah})),
      ...DB.produksi.map(t=>({...t,_jenis:'Produksi',_ket:t.produkJadiNama,_nilai:t.qtyJadi})),
      ...DB.jurnal.map(t=>({...t,_jenis:'Jurnal',_ket:t.keterangan,_nilai:t.totalDebit}))
    ].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
    let rows=all.map(t=>`<tr><td>${fmtDate(t.tanggal)}</td><td><span class="tag tag-gray">${safe(t._jenis)}</span></td><td>${safe(t._ket)}</td><td class="num">${fmtIDR(t._nilai)}</td><td>${statusTag(t.status)}</td><td class="audit-user">${safe(t.diubahOlehJabatan||t.dibuatOlehJabatan||t.diubahOlehNama||t.dibuatOlehNama||userLabel(t.diubahOleh||t.dibuatOleh||''))}</td></tr>`).join('');
    if(!all.length)rows='<tr><td colspan="6"><div class="empty-state">Belum ada riwayat transaksi.</div></td></tr>';
    return `<div class="card"><div class="card-head"><div><h3>Riwayat Transaksi &amp; Audit</h3><div class="desc">Setiap transaksi menampilkan nama akun yang terakhir membuat atau mengubah data.</div></div></div><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nilai</th><th>Status</th><th>Dilakukan Oleh</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  };

  /* Pasang profil dan UI setelah patch dimuat. */
  setTimeout(()=>{try{ensureSecurityDB();auditSnapshot=deepClone(DB);if(session&&session.role){applyProfile();buildNav();refreshNotifUI();}}catch(e){console.error('ERP patch',e)}},0);
})();
</script>

<script id="professionalAccountUIJS">
(function(){
  const PATCH_KEY='erp:professional-ui:v4';
  const PAGE=typeof APP_PAGE!=='undefined'?APP_PAGE:'owner';
  const isOwner=PAGE==='owner';
  const ADMIN_PAGES=['fitri','riska','orhan','siti','abah'];
  const defaults={fitri:'Sukses123',riska:'Sukses123',orhan:'Sukses123',siti:'Sukses123',abah:'Sukses123',owner:'Owner@2026'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function ensure(){
    if(!DB)return;
    DB.users=DB.users||{}; DB.settings=DB.settings||{}; DB.settings.loginBackground=DB.settings.loginBackground||'assets/login-background.png';
    DB.accountMap=DB.accountMap||{};
    ADMIN_PAGES.concat(['owner']).forEach(p=>{
      if(!DB.accountMap[p]) DB.accountMap[p]=p;
      const u=DB.accountMap[p];
      if(!DB.users[u]) DB.users[u]={password:defaults[p],role:p==='owner'?'master':'admin',name:p==='owner'?'ANDI RAHMAN S.Pi':p.charAt(0).toUpperCase()+p.slice(1),jabatan:p==='owner'?'Direktur / Owner':'Admin'};
      if(!DB.users[u].password)DB.users[u].password=defaults[p];
      if(p!=='owner' && !('permissions' in DB.users[u])) DB.users[u].permissions=null;
    });
  }
  function currentUsername(){ensure();return DB&&DB.accountMap?DB.accountMap[PAGE]:PAGE}
  function applyLoginBg(){ensure();const bg=(DB.settings&&DB.settings.loginBackground)||'assets/login-background.png';const el=document.getElementById('loginScreen');if(el)el.style.backgroundImage=`url("${bg}")`}
  function themeKey(){return 'erp:theme:'+PAGE}
  function applyTheme(){const t=localStorage.getItem(themeKey())||'3d';document.body.classList.toggle('ui-3d',t==='3d');document.body.classList.toggle('ui-light',t==='light');const b=document.getElementById('accountModeSwitch');if(b)b.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.mode===t))}
  window.setAccountTheme=function(t){localStorage.setItem(themeKey(),t);applyTheme()}
  function addThemeSwitch(){const top=document.querySelector('.topbar');if(!top||document.getElementById('accountModeSwitch'))return;const holder=document.createElement('div');holder.id='accountModeSwitch';holder.className='account-mode-switch';holder.innerHTML='<button data-mode="3d" onclick="setAccountTheme(\'3d\')">◈ DARK 3D</button><button data-mode="light" onclick="setAccountTheme(\'light\')">○ CERAH</button>';top.appendChild(holder);applyTheme()}
  function ripple(x,y){const r=document.createElement('span');r.className='ui-ripple';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600)}
  document.addEventListener('click',e=>{const n=e.target.closest('.nav-item');if(n){n.classList.remove('nav-clicking');void n.offsetWidth;n.classList.add('nav-clicking');ripple(e.clientX,e.clientY)}});
  const originalGo=window.goPage;
  if(originalGo){window.goPage=function(id){return originalGo(id)}}

  // Make the login use the Owner-configured account username instead of a hard-coded value.
  const oldDoLogin=window.doLogin;
  window.doLogin=async function(){
    ensure(); const u=currentUsername(); const input=document.getElementById('loginUser'); if(input)input.value=u;
    const p=document.getElementById('loginPass')?.value||''; const rec=DB.users[u]; const err=document.getElementById('loginErr');
    if(!rec||rec.password!==p||rec.role!==APP_ROLE){if(err)err.textContent='Username atau password salah.';return;}
    session={role:rec.role,name:rec.name,user:u,page:PAGE}; if(typeof saveSession==='function')saveSession();
    document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';
    if(typeof buildNav==='function')buildNav();if(typeof applyProfile==='function')applyProfile();if(typeof goPage==='function')goPage('dashboard');
    addThemeSwitch();applyTheme();if(typeof startHourlyChime==='function')startHourlyChime();
  };
  // Restore must resolve renamed usernames through accountMap.
  const oldRestore=window.restoreSession;
  window.restoreSession=async function(){
    ensure();const s=typeof loadSession==='function'?await loadSession():null;const u=currentUsername();
    if(!s||s.page!==PAGE||s.user!==u||s.role!==APP_ROLE||!DB.users[u])return false;
    session=s;document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';
    if(typeof buildNav==='function')buildNav();if(typeof applyProfile==='function')applyProfile();if(typeof goPage==='function')goPage('dashboard');addThemeSwitch();applyTheme();if(typeof startHourlyChime==='function')startHourlyChime();return true;
  };

  function approvalHTML(){
    const names=['Owner / Direktur','Admin 1','Admin 2','Admin 3','Admin 4','Admin 5'];
    return '<div class="print-approval">'+names.map(n=>`<div class="approval-cell"><b>${n}</b><span>Nama &amp; Tanda Tangan</span></div>`).join('')+'</div>';
  }
  const oldPrintFooter=window.createPrintFooter;
  if(oldPrintFooter){window.createPrintFooter=function(){return oldPrintFooter()+approvalHTML()}}

  // Owner settings: username + password + login background + permissions.
  if(isOwner){
    const oldSettings=window.renderPengaturan;
    window.renderPengaturan=function(){
      ensure();const navs=NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly);const rows=ADMIN_PAGES.map((p,i)=>{
        const u=DB.accountMap[p],r=DB.users[u]||{};const active=Array.isArray(r.permissions)?r.permissions:navs.map(x=>x.id);
        const checks=navs.map(x=>`<label class="checkbox-item"><input type="checkbox" id="pu_${p}_${x.id}" ${active.includes(x.id)?'checked':''}> ${esc(x.label)}</label>`).join('');
        return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Admin ${i+1} — ${esc(r.name||p)}</h3><div class="desc">Atur username, password, jabatan, dan hak akses akun ini.</div></div></div><div class="form-grid"><div class="form-field"><label>Username Admin ${i+1}</label><input id="uname_${p}" value="${esc(u)}" autocomplete="off"></div><div class="form-field"><label>Password Baru</label><input id="pass_${p}" type="password" placeholder="Kosongkan jika tidak diubah"></div><div class="form-field"><label>Jabatan</label><input id="jab_${p}" value="${esc(r.jabatan||'Admin')}"></div></div><div class="checkbox-grid">${checks}</div></div>`;
      }).join('');
      const bg=(DB.settings.loginBackground||'assets/login-background.png');
      return `<div class="card"><div class="card-head"><div><h3>Password &amp; Hak Akses</h3><div class="desc">Perubahan username/password berlaku pada halaman akun masing-masing dan tersimpan di database yang sama.</div></div></div><div class="form-field"><label>Gambar Login Custom</label><input id="loginBgFile" type="file" accept="image/png,image/jpeg,image/webp"><div style="margin-top:8px;font-size:11px;color:var(--ink-soft)">Default: assets/login-background.png</div><img src="${esc(bg)}" style="margin-top:10px;width:min(100%,420px);height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line)"></div></div>${rows}<div style="margin-top:16px"><button class="btn btn-em" onclick="saveProfessionalAccountSettings()">Simpan Semua Pengaturan</button></div>`;
    };
    window.saveProfessionalAccountSettings=async function(){
      ensure();
      for(const p of ADMIN_PAGES){
        const oldU=DB.accountMap[p], rec=DB.users[oldU]||{};const newU=(document.getElementById('uname_'+p)?.value||oldU).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
        if(!newU){toast('Username Admin '+p+' tidak boleh kosong','err');return}
        if(newU!==oldU && DB.users[newU]){toast('Username '+newU+' sudah digunakan','err');return}
        if(newU!==oldU){DB.users[newU]=rec;delete DB.users[oldU];DB.accountMap[p]=newU}
        const r=DB.users[newU];const pw=document.getElementById('pass_'+p)?.value||'';if(pw)r.password=pw;r.jabatan=document.getElementById('jab_'+p)?.value||'Admin';
        r.permissions=navsForSave().filter(x=>document.getElementById('pu_'+p+'_'+x.id)?.checked).map(x=>x.id);
      }
      const f=document.getElementById('loginBgFile');if(f&&f.files&&f.files[0]){const file=f.files[0];if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Format gambar login harus PNG/JPG/WEBP','err');return}DB.settings.loginBackground=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)})}
      await saveDB();applyLoginBg();toast('Username, password, hak akses dan tampilan login berhasil disimpan','ok');buildNav();render();
    };
    function navsForSave(){return NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly)}
  }
  // Initialize after original scripts have created DB.
  setTimeout(()=>{try{ensure();applyLoginBg();addThemeSwitch();applyTheme();const u=currentUsername();const li=document.getElementById('loginUser');if(li)li.value=u;}catch(e){console.error('Professional UI patch',e)}},100);
})();
</script>


<script>
/* ================= UPGRADE FITUR 11 AKUN / AUDIT / ABSEN / SURAT ================= */
function ensureUpgradeDB(){

async function captureCamera(title='Dokumentasi Kamera'){
  cameraOverlay(); document.getElementById('cameraTitle').textContent=title; document.getElementById('cameraOverlay').classList.add('show');
  try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream;}
  catch(e){cancelCamera();toast('Kamera tidak tersedia/izin ditolak. Anda tetap dapat melanjutkan tanpa foto.','err');return null}

}

</body>

<script id="transactionAuditCalmPatch">(function(){

function stamp(r,c){if(!r||typeof r!=='object')return r;const u=DB.users?.[session?.user]||{};const user=session?.user||window.APP_USER||'',name=session?.name||u.name||window.APP_NAME||'',role=session?.role||window.APP_ROLE||'',jab=u.jabatan||u.position||(role==='master'?'Master / Owner':'Admin'),t=new Date().toISOString();if(!r.dibuatOleh)r.dibuatOleh=user;if(!r.dibuatOlehNama)r.dibuatOlehNama=name;if(!r.dibuatOlehRole)r.dibuatOlehRole=role;if(!r.dibuatOlehJabatan)r.dibuatOlehJabatan=jab;if(!r.dibuatPada)r.dibuatPada=t;if(!r.keteranganAktivitas)r.keteranganAktivitas='Dibuat oleh '+name+' ('+jab+')';r._collection=r._collection||c;return r}

window.erpInstallTransactionAudit=install;
const ld=window.loadDB;if(typeof ld==='function')window.loadDB=async function(){const r=await ld();install();return r};

function masterPanel(){if(session?.role!=='master'||currentPage!=='dashboard')return;const c=document.getElementById('content');if(!c||document.getElementById('masterActivityPanel'))return;const p=document.createElement('div');p.id='masterActivityPanel';c.appendChild(p);const rows=(DB.activityLog||[]).slice().sort((a,b)=>String(b.waktu).localeCompare(String(a.waktu))).slice(0,40).map(a=>'<tr><td>'+new Date(a.waktu).toLocaleString('id-ID')+'</td><td><b>'+esc(a.jabatan||a.role)+'</b><div class="audit-sub">'+esc(a.name)+'</div></td><td>'+esc(a.jenis)+'</td><td>'+esc(a.keterangan||'-')+'</td><td>'+esc(a.user||'-')+'</td></tr>').join('')||'<tr><td colspan="5"><div class="empty-state">Belum ada aktivitas admin.</div></td></tr>';p.innerHTML='<div class="card master-activity-card"><div class="card-head"><div><h3>Integrasi Aktivitas Admin → Master</h3><div class="desc">Semua transaksi/data admin tercatat otomatis beserta akun, jabatan, tanggal, waktu dan keterangan.</div></div><span class="tag tag-green">REALTIME LOG</span></div><table><thead><tr><th>Waktu</th><th>Pelaksana</th><th>Jenis</th><th>Keterangan</th><th>Username</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}

<script id="fiturPersetujuanTombolTambahTransaksiRiwayat">
(function(){
  'use strict';

  /* 1) Fitur "Persetujuan & Tanda Tangan Cetak" dimasukkan ke Navigasi "Pengguna & Password"
        -> "Kelola akun login". Master melihat pengaturan lengkap; Admin melihat akun sendiri —
        keduanya melihat checklist Persetujuan & Tanda Tangan Cetak di bagian bawah. */
  window.saveAkunSendiri = async function(){
    if (typeof session === 'undefined' || !session || !session.user || typeof DB === 'undefined') return;
    const rec = DB.users[session.user]; if (!rec) return;
    const p = (typeof val === 'function') ? val('myNewPass') : '';
    if (p) rec.password = p;
    const jab = (typeof val === 'function') ? val('myJabatan') : '';
    if (jab) { rec.jabatan = jab; rec.position = jab; }
    if (typeof saveDB === 'function') await saveDB();
    if (typeof toast === 'function') toast('Akun Anda berhasil diperbarui', 'ok');
    const pw = document.getElementById('myNewPass'); if (pw) pw.value = '';
    if (typeof render === 'function') render();
  };
  window.renderAkunSendiriAdmin = function(){
    if (typeof session === 'undefined' || !session || typeof DB === 'undefined') return '';
    const rec = DB.users[session.user] || {};
    const sig = (typeof sigImg === 'function') ? sigImg(session.user) : (rec.signature || '');
    return `<div class="card"><div class="card-head"><div><h3>Akun Saya</h3><div class="desc">Kelola username, password dan tanda tangan akun Anda sendiri. Untuk hak akses dan akun lain, hubungi Master/Owner.</div></div></div>
      <div class="form-grid">
        <div class="form-field"><label>Username</label><input value="${(typeof escapeAttr==='function'?escapeAttr(session.user||''):(session.user||''))}" readonly></div>
        <div class="form-field"><label>Nama / Jabatan</label><input id="myJabatan" value="${(typeof escapeAttr==='function'?escapeAttr(rec.jabatan||rec.position||''):(rec.jabatan||rec.position||''))}"></div>
        <div class="form-field"><label>Password Baru</label><input id="myNewPass" type="password" placeholder="Kosongkan jika tidak diubah"></div>
      </div>
      <div style="margin-top:14px"><button class="btn btn-em" onclick="saveAkunSendiri()">Simpan Akun Saya</button></div>
    </div>`;
  };
  const oldRenderPengaturan = window.renderPengaturan;
  window.renderPengaturan = function(){
    if (typeof session === 'undefined' || !session) return typeof oldRenderPengaturan === 'function' ? oldRenderPengaturan() : '';
    let base;
    if (session.role === 'master') {
      base = typeof oldRenderPengaturan === 'function' ? oldRenderPengaturan() : '';
    } else {
      base = window.renderAkunSendiriAdmin();
    }
    return base;
  };

  /* 2) Tombol "Tambah Transaksi" pada setiap halaman navigasi "Operasional & Kontrol" — khusus Akun Admin. */
  window.openQuickTransaksiModal = function(){
    if (typeof openModal !== 'function') return;
    openModal(`<h3>Tambah Transaksi</h3><div class="desc" style="margin-bottom:14px">Pilih jenis transaksi yang ingin dicatat. Anda akan diarahkan ke modul terkait.</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-em" onclick="closeModal();goPage('penjualan');setTimeout(function(){if(typeof modalPenjualan==='function')modalPenjualan();},150)">↗ Transaksi Penjualan</button>
      <button class="btn btn-em" onclick="closeModal();goPage('pembelian');setTimeout(function(){if(typeof modalPembelian==='function')modalPembelian();},150)">↙ Transaksi Pembelian</button>
      <button class="btn btn-em" onclick="closeModal();goPage('produksi');setTimeout(function(){if(typeof modalProduksi==='function')modalProduksi();},150)">⚙ Catat Produksi</button>
      <button class="btn btn-em" onclick="closeModal();goPage('kasbank');setTimeout(function(){if(typeof modalKasBank==='function')modalKasBank();},150)">$ Mutasi Kas & Bank</button>
    </div>
    <div style="margin-top:16px;text-align:right"><button class="btn" onclick="closeModal()">Batal</button></div>`);
  };
  window.renderTambahTransaksiBtn = function(){
    if (typeof session === 'undefined' || !session || session.role !== 'admin') return '';
    return `<button class="btn btn-gold" onclick="openQuickTransaksiModal()">+ Tambah Transaksi</button>`;
  };
  const oldRenderPageShell = window.renderPageShell;
  if (typeof oldRenderPageShell === 'function') {
    window.renderPageShell = function(html){
      let out = oldRenderPageShell(html);
      const btn = window.renderTambahTransaksiBtn();
      if (btn) out = out.replace('<div style="display:flex;gap:8px;flex-wrap:wrap">', '<div style="display:flex;gap:8px;flex-wrap:wrap">' + btn);
      return out;
    };
  }

  /* 3) Setiap transaksi (Master & Admin) tercatat realtime di "Riwayat Transaksi" beserta keterangan pelaku. */
  const REALTIME_COLS = ['penjualan','pembelian','kasbank','produksi','jurnal'];
  function stampAndLog(c, r){
    if (!r || typeof r !== 'object') return;
    if (typeof session === 'undefined' || !session || !session.user) return;
    const u = (typeof DB !== 'undefined' && DB.users && DB.users[session.user]) || {};
    if (!r.dibuatOleh) r.dibuatOleh = session.user || '';
    if (!r.dibuatOlehNama) r.dibuatOlehNama = session.name || u.name || '';
    if (!r.dibuatOlehRole) r.dibuatOlehRole = session.role || '';
    if (!r.dibuatOlehJabatan) r.dibuatOlehJabatan = u.jabatan || u.position || (session.role === 'master' ? 'Master / Owner' : 'Admin');
    if (!r.dibuatPada) r.dibuatPada = new Date().toISOString();
    if (typeof DB !== 'undefined') {
      DB.activityLog = DB.activityLog || [];
      DB.activityLog.push({
        id: 'ACT-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        collection: c, recordId: r.id || '', user: r.dibuatOleh, name: r.dibuatOlehNama,
        role: r.dibuatOlehRole, jabatan: r.dibuatOlehJabatan, waktu: r.dibuatPada,
        keterangan: r.keterangan || r.mitraNama || r.produkJadiNama || r.id || 'Transaksi baru'
      });
      if (DB.activityLog.length > 2000) DB.activityLog = DB.activityLog.slice(-2000);
    }
  }
  function installRealtimeStamp(){
    if (typeof DB === 'undefined' || !DB) return;
    REALTIME_COLS.forEach(c=>{
      if (!Array.isArray(DB[c])) DB[c] = [];
      const arr = DB[c];
      if (arr.__realtimeStamped) return;
      const origPush = arr.push.bind(arr);
      arr.push = function(){
        const items = [...arguments];
        items.forEach(r=>stampAndLog(c, r));
        return origPush(...items);
      };
      try { Object.defineProperty(arr, '__realtimeStamped', {value:true, enumerable:false}); } catch(e){ arr.__realtimeStamped = true; }
    });
  }
  const oldGoPage2 = window.goPage;
  if (typeof oldGoPage2 === 'function') window.goPage = function(){ installRealtimeStamp(); return oldGoPage2.apply(this, arguments); };
  const oldRender2 = window.render;
  if (typeof oldRender2 === 'function') window.render = function(){ installRealtimeStamp(); return oldRender2.apply(this, arguments); };
  setTimeout(installRealtimeStamp, 300);
  setInterval(installRealtimeStamp, 2000);
})();
</script>

<script id="itSupportPatchScript">
(function(){
  'use strict';

  // 1. Inisialisasi Akun IT Support
  const _oldEnsureUpgradeDB = window.ensureUpgradeDB || function(){};
  window.ensureUpgradeDB = function() {
    _oldEnsureUpgradeDB();
    if (!DB.users) DB.users = {};
    if (!DB.users['itsupport']) {
      DB.users['itsupport'] = {
        password: 'ITSupport@2026',
        role: 'itsupport',
        name: 'IT Support System',
        jabatan: 'God Mode Admin',
        aktif: true,
        terimaTTD: true,
        permissions: null,
        route: 'itsupport'
      };
    }
  };

  // 2. Izinkan IT Support Login & Bypass Pembatasan Menu
  const _oldDoLogin = window.doLogin;
  window.doLogin = async function() {
    if (!DB) return;
    const entered = String(document.getElementById('loginUser').value || '').trim().toLowerCase();
    if (entered === 'itsupport') {
       const p = document.getElementById('loginPass').value;
       if (DB.users['itsupport'] && DB.users['itsupport'].password === p) {
           session = {role: 'itsupport', name: DB.users['itsupport'].name, user: 'itsupport', page: typeof APP_PAGE !== 'undefined' ? APP_PAGE : 'itsupport'};
           document.getElementById('loginErr').textContent = '';
           document.getElementById('loginScreen').style.display = 'none';
           document.getElementById('app').style.display = 'block';
           document.getElementById('roleLabel').textContent = session.name;
           const rt = document.getElementById('roleTag');
           if (rt) { rt.textContent = 'IT SUPPORT'; rt.className = 'tag tag-gold'; }
           if (typeof saveSession === 'function') saveSession();
           if (typeof buildNav === 'function') buildNav();
           if (typeof goPage === 'function') goPage('dashboard');
           return;
       }
    }
    if (typeof _oldDoLogin === 'function') return _oldDoLogin.apply(this, arguments);
  };

  const _oldIsMenuAllowed = window.isMenuAllowed;
  window.isMenuAllowed = function(id) {
    // IT Support dapat mengakses SEMUA menu tanpa terkecuali
    if (session && session.role === 'itsupport') return true;
    if (typeof _oldIsMenuAllowed === 'function') return _oldIsMenuAllowed(id);
    return true;
  };

  // 3. Panel Khusus IT Support
  const _oldRenderPengaturan = window.renderPengaturan;
  window.renderPengaturan = function() {
    if (session && session.role === 'itsupport') {
       return renderITSupportPanel();
    }
    if (typeof _oldRenderPengaturan === 'function') return _oldRenderPengaturan();
    return '';
  };

  window.renderITSupportPanel = function() {
    let userCards = Object.keys(DB.users).map(u => {
      const r = DB.users[u];
      const isOwner = r.role === 'master';
      const isIT = r.role === 'itsupport';
      const badge = isOwner ? 'tag-gold' : (isIT ? 'tag-red' : 'tag-green');
      const sigUrl = (DB.signatures && DB.signatures[u]) || r.signature || '';
      return `<div class="card" style="border-left: 4px solid ${isOwner ? '#c9a227' : (isIT ? '#c94b3f' : '#16a878')}">
        <b>${safeText(r.name)}</b> <span class="tag ${badge}">${u} (${r.role})</span>
        <div style="margin-top:10px">
           <label style="font-size:11px;color:var(--ink-soft);font-weight:bold">Kontrol Password</label>
           <input id="it_pw_${u}" class="it-pass-input" type="text" value="${escapeAttr(r.password)}">
        </div>
        <div style="margin-top:10px">
           <label class="btn btn-sm">Ganti Tanda Tangan PNG
             <input type="file" accept="image/png,image/jpeg" style="display:none" onchange="uploadSignatureIT('${u}', this.files[0])">
           </label>
        </div>
        ${sigUrl ? `<img src="${sigUrl}" style="height:45px;margin-top:8px;display:block;border:1px solid var(--line);border-radius:4px;padding:2px">` : '<small style="color:var(--ink-soft);display:block;margin-top:4px">Belum ada TTD</small>'}
      </div>`;
    }).join('');

    return `<div class="card"><div class="card-head"><div><h3 style="color:var(--red)!important">💻 PANEL KONTROL IT SUPPORT (GOD MODE)</h3><div class="desc">Anda memegang kendali penuh atas semua kredensial, password, dan tanda tangan seluruh pengguna (termasuk Owner). Anda melihat password dalam bentuk teks jelas.</div></div></div>
    <div class="feature-grid">${userCards}</div>
    <div style="margin-top:16px"><button class="btn btn-em" style="background:var(--red);box-shadow:0 6px 16px rgba(201,75,63,0.3)" onclick="simpanKredensialIT()">⚠ Simpan Semua Perubahan Kredensial</button></div>
    </div>

    <div class="card"><div class="card-head"><div><h3>🎨 Kontrol Tema & Warna Sistem</h3><div class="desc">Ganti warna identitas sistem untuk semua pengguna secara instan.</div></div></div>
    <div class="form-grid">
        <div class="form-field"><label>Warna Aksen Utama (Tombol & Highlight)</label><input type="color" id="it_color_main" value="${DB.settings?.themeColor || '#16a878'}" style="height:44px;padding:2px;cursor:pointer"></div>
    </div>
    <div style="margin-top:16px"><button class="btn btn-gold" onclick="simpanTemaIT()">Terapkan Warna ke Sistem</button></div>
    </div>`;
  };

  window.uploadSignatureIT = async function(u, file) {
    if(!file) return;
    const dataUrl = await fileToDataURL(file);
    DB.users[u].signature = dataUrl;
    if(!DB.signatures) DB.signatures = {};
    DB.signatures[u] = dataUrl;
    await saveDB(); toast('Tanda tangan '+u+' diganti', 'ok'); render();
  };

  window.simpanKredensialIT = async function() {
     Object.keys(DB.users).forEach(u => {
        const valPw = document.getElementById('it_pw_'+u)?.value;
        if(valPw) DB.users[u].password = valPw;
     });
     await saveDB(); toast('Kredensial dan Password semua akun berhasil diperbarui', 'ok'); render();
  };

  window.simpanTemaIT = async function() {
     const col = document.getElementById('it_color_main').value;
     if(!DB.settings) DB.settings = {};
     DB.settings.themeColor = col;
     await saveDB();
     applyTemaGlobal();
     toast('Tema warna global diterapkan', 'ok');
  };

  window.applyTemaGlobal = function() {
     if(typeof DB !== 'undefined' && DB.settings && DB.settings.themeColor) {
         document.documentElement.style.setProperty('--emerald', DB.settings.themeColor);
         document.documentElement.style.setProperty('--emerald-dark', DB.settings.themeColor);
     }
  };

  // 4. Tombol "Tambahkan" Global untuk Admin & Master
  window.renderGlobalAddBtn = function() {
    if(!document.getElementById('globalAddBtn') && session && session.role) {
        const btn = document.createElement('button');
        btn.id = 'globalAddBtn';
        btn.className = 'btn-global-add no-print';
        btn.innerHTML = '<span>➕</span> Tambah Transaksi / Data';
        btn.onclick = window.openGlobalMegaMenu;
        document.body.appendChild(btn);
    }
  };

  window.openGlobalMegaMenu = function() {
      openModal(`<h3>Menu Aksi Cepat</h3><div class="desc" style="margin-bottom:16px">Pilih formulir pencatatan yang ingin Anda buka saat ini.</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <button class="btn btn-em" onclick="closeModal();goPage('penjualan');setTimeout(modalPenjualan,300)">↗ Penjualan Baru</button>
          <button class="btn btn-em" onclick="closeModal();goPage('pembelian');setTimeout(modalPembelian,300)">↙ Pembelian Baru</button>
          <button class="btn btn-em" onclick="closeModal();goPage('kasbank');setTimeout(modalKasBank,300)">$ Mutasi Kas/Bank</button>
          <button class="btn btn-em" onclick="closeModal();goPage('produksi');setTimeout(modalProduksi,300)">⚙ Catat Produksi</button>
          <button class="btn btn-gold" onclick="closeModal();goPage('produk');setTimeout(modalProduksi,300)">▣ Input Produk</button>
          <button class="btn btn-gold" onclick="closeModal();goPage('mitra');setTimeout(modalMitra,300)">☺ Input Mitra</button>
      </div>
      <div style="margin-top:16px;text-align:right"><button class="btn btn-red" onclick="closeModal()">Tutup</button></div>`);
  };

  // Pasang hook tombol ke buildNav
  const _oldBuildNav = window.buildNav;
  window.buildNav = function() {
     if (typeof _oldBuildNav === 'function') _oldBuildNav();
     renderGlobalAddBtn();
  };

  // Terapkan tema warna global pada awal load
  setTimeout(applyTemaGlobal, 500);

})();
</script>



<!-- ============================================================
     MASTER / OWNER + 10 ADMIN + 10 DIVISI + WHATSAPP + MYSQL
     PATCH v3

     ============================================================ -->

<script id="ownerDivisionPatchScript">
(function(){
  'use strict';

  const ADMIN10 = Array.from({length:10},(_,i)=>'admin'+(i+1));
  const DIV10   = Array.from({length:10},(_,i)=>'divisi'+(i+1));

  const defaultDivNames = [
    'Divisi Ikan','Divisi Pertanian','Divisi 3','Divisi 4','Divisi 5',
    'Divisi 6','Divisi 7','Divisi 8','Divisi 9','Divisi 10'
  ];

  const allMenuIds = () => NAV.flatMap(g=>g.items).filter(x=>!x.masterOnly).map(x=>x.id);

  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escAttr(v){ return esc(v).replace(/`/g,'&#96;'); }

  function defaultDivisionPerms(i){
    const all=allMenuIds();
    if(i===1) return all.filter(x=>['dashboard','produk','mitra','penjualan','pembelian','produksi','stockmovement','kasbank','piutang','hutang','riwayat','pengajuan','bukutamu'].includes(x));
    if(i===2) return all.filter(x=>['dashboard','produk','mitra','penjualan','pembelian','produksi','stockmovement','kasbank','riwayat','pengajuan'].includes(x));
    return all.filter(x=>['dashboard','produk','mitra','riwayat','pengajuan'].includes(x));
  }

  function ensureOwnerDivisionDB(){
    if(!DB) return;
    if(!DB.users) DB.users={};
    if(!DB.settings) DB.settings={};
    if(!Array.isArray(DB.waContacts)) DB.waContacts=[];
    if(!Array.isArray(DB.accountLogs)) DB.accountLogs=[];
    if(!DB.signatures || typeof DB.signatures!=='object') DB.signatures={};
    if(!DB.signatureChecklistAccess || typeof DB.signatureChecklistAccess!=='object') DB.signatureChecklistAccess={};
    if(!DB.printChecks || typeof DB.printChecks!=='object') DB.printChecks={};

    // 10 Admin resmi.
    ADMIN10.forEach((u,i)=>{
      const old=DB.users[u]||{};
      DB.users[u]=Object.assign({
        password:'Sukses123',
        role:'admin',
        name:'Admin '+(i+1),
        jabatan:'Admin '+(i+1),
        route:'admin'+(i+1),
        aktif:true,
        terimaTTD:true,
        signatureChecklistEnabled:false,
        permissions:null,
        phone:''
      },old);
      if(!DB.users[u].route) DB.users[u].route='admin'+(i+1);
      if(DB.users[u].aktif===undefined) DB.users[u].aktif=true;
    });

    // 10 Divisi resmi.
    DIV10.forEach((u,i)=>{
      const old=DB.users[u]||{};
      DB.users[u]=Object.assign({
        password:'Sukses123',
        role:'division',
        name:defaultDivNames[i],
        jabatan:defaultDivNames[i],
        divisionNo:i+1,
        divisionName:defaultDivNames[i],
        route:'divisi'+(i+1),
        aktif:true,
        permissions:defaultDivisionPerms(i+1),
        signatureChecklistEnabled:false,
        phone:''
      },old);
      if(!Array.isArray(DB.users[u].permissions)) DB.users[u].permissions=defaultDivisionPerms(i+1);
      if(DB.users[u].aktif===undefined) DB.users[u].aktif=true;
      if(!DB.users[u].divisionNo) DB.users[u].divisionNo=i+1;
      if(!DB.users[u].divisionName) DB.users[u].divisionName=defaultDivNames[i];
      if(!DB.users[u].jabatan) DB.users[u].jabatan=DB.users[u].divisionName;
    });

    if(DB.users.owner){
      DB.users.owner.role='master';
      DB.users.owner.jabatan=DB.users.owner.jabatan||'Direktur / Owner';
      DB.users.owner.aktif=true;
    }
    DB.settings.adminSlots=10;
    DB.settings.divisionSlots=10;
    [...ADMIN10,...DIV10].forEach(u=>{
      if(typeof DB.users[u].signatureChecklistEnabled!=='boolean') DB.users[u].signatureChecklistEnabled=!!DB.signatureChecklistAccess[u];
      DB.signatureChecklistAccess[u]=DB.users[u].signatureChecklistEnabled===true;
    });
  }

  ensureOwnerDivisionDB();

  // 4 menu khusus Master.
  NAV.push({
    group:'OWNER / MASTER',
    items:[
      {id:'master_admin',ic:'👥',label:'10 Akun Admin',masterOnly:true},
      {id:'master_divisi',ic:'🏢',label:'10 Akun Divisi',masterOnly:true},
      {id:'master_hakakses',ic:'🔐',label:'Hak Akses & Menu',masterOnly:true},
      {id:'master_whatsapp',ic:'💬',label:'WhatsApp & Kontak',masterOnly:true}
    ]
  });

  Object.assign(TITLES,{
    master_admin:['10 Akun Admin','Kelola username, password, nama, jabatan, status dan kontak Admin 1–10'],
    master_divisi:['10 Akun Divisi','Kelola Divisi 1–10 dan menu yang dapat diakses'],
    master_hakakses:['Hak Akses & Menu','Owner menentukan menu Admin dan setiap Divisi'],
    master_whatsapp:['WhatsApp & Kontak','Pusat kontak dan pesan WhatsApp berdasarkan keterangan/transaksi']
  });

  // Render empat halaman Master.
  function guardOwner(){
    if(!session || session.role!=='master'){
      return '<div class="card"><h3>Akses ditolak</h3><p class="muted">Menu ini hanya dapat dibuka oleh Owner / Master.</p></div>';
    }
    return '';
  }

  function renderAdminAccounts(){
    const g=guardOwner(); if(g)return g;
    const cards=ADMIN10.map((u,i)=>{
      const r=DB.users[u]||{};
      return `<div class="owner-card">
        <h4>👤 Admin ${i+1} <span class="tag ${r.aktif!==false?'tag-green':'tag-red'}">${r.aktif!==false?'AKTIF':'NONAKTIF'}</span></h4>
        <div class="form-field"><label>Username</label><input id="adm_u_${i}" value="${escAttr(u)}" readonly></div>
        <div class="form-field"><label>Nama Admin</label><input id="adm_n_${i}" value="${escAttr(r.name||'Admin '+(i+1))}"></div>
        <div class="form-field"><label>Jabatan</label><input id="adm_j_${i}" value="${escAttr(r.jabatan||'Admin '+(i+1))}"></div>
        <div class="form-field"><label>No. WhatsApp</label><input id="adm_p_${i}" value="${escAttr(r.phone||'')}" placeholder="08xxxxxxxxxx"></div>
        <div class="form-field"><label>Password Baru</label><input id="adm_pw_${i}" type="password" placeholder="Kosongkan jika tidak diubah"></div>
        <label class="checkbox-item"><input id="adm_a_${i}" type="checkbox" ${r.aktif!==false?'checked':''}> Akun aktif & boleh login</label>
      </div>`;
    }).join('');
    return `<div class="card"><div class="card-head"><div><h3>10 Akun Admin</h3><div class="desc">Owner mengendalikan seluruh akun Admin. Username admin1–admin10 dibuat permanen di database.</div></div><button class="btn btn-em" onclick="saveMasterAdmins()">💾 Simpan Semua</button></div><div class="owner-grid">${cards}</div></div>`;
  }

  function renderDivisionAccounts(){
    const g=guardOwner(); if(g)return g;
    const cards=DIV10.map((u,i)=>{
      const r=DB.users[u]||{};
      return `<div class="owner-card">
        <h4>🏢 Divisi ${i+1} <span class="tag ${r.aktif!==false?'tag-green':'tag-red'}">${r.aktif!==false?'AKTIF':'NONAKTIF'}</span></h4>
        <div class="form-field"><label>Username</label><input value="${escAttr(u)}" readonly></div>
        <div class="form-field"><label>Nama Divisi</label><input id="div_n_${i}" value="${escAttr(r.divisionName||r.name||defaultDivNames[i])}"></div>
        <div class="form-field"><label>Jabatan/Keterangan</label><input id="div_j_${i}" value="${escAttr(r.jabatan||'')}"></div>
        <div class="form-field"><label>No. WhatsApp</label><input id="div_p_${i}" value="${escAttr(r.phone||'')}" placeholder="08xxxxxxxxxx"></div>
        <div class="form-field"><label>Password Baru</label><input id="div_pw_${i}" type="password" placeholder="Kosongkan jika tidak diubah"></div>
        <label class="checkbox-item"><input id="div_a_${i}" type="checkbox" ${r.aktif!==false?'checked':''}> Akun aktif & boleh login</label>
      </div>`;
    }).join('');
    return `<div class="card"><div class="card-head"><div><h3>10 Akun Divisi</h3><div class="desc">Divisi 1 = Ikan, Divisi 2 = Pertanian. Divisi 3–10 bebas dicustom oleh Owner.</div></div><button class="btn btn-em" onclick="saveMasterDivisions()">💾 Simpan Semua</button></div><div class="owner-grid">${cards}</div></div>`;
  }

  function permissionCard(u,label){
    const r=DB.users[u]||{};
    const current=Array.isArray(r.permissions)?r.permissions:allMenuIds();
    const sigEnabled=r.signatureChecklistEnabled===true;
    const sig=sigImg(u);
    const checks=NAV.flatMap(g=>g.items).filter(it=>!it.masterOnly).map(it=>
      `<label class="checkbox-item"><input type="checkbox" data-user="${escAttr(u)}" data-perm="${escAttr(it.id)}" ${current.includes(it.id)?'checked':''}> ${esc(it.label)}</label>`
    ).join('');
    return `<div class="owner-card">
      <h4>${esc(label)} <span class="tag tag-green">${esc(u)}</span></h4>
      <div class="muted">Centang menu yang boleh dilihat/dibuka. Menu yang tidak dicentang otomatis hilang dari navigasi dan ditolak oleh route guard.</div>
      <div class="form-field" style="margin-top:12px">
        <label>Tanda Tangan ${esc(label)}</label>
        <label class="btn btn-sm">✍️ Upload Tanda Tangan PNG/JPG
          <input type="file" accept="image/png,image/jpeg" style="display:none" onchange="uploadSignature('${escAttr(u)}',this.files[0])">
        </label>
        ${sig?`<div style="margin-top:8px"><img class="feature-photo" src="${sig}" alt="Tanda tangan ${escAttr(label)}" style="max-height:90px;max-width:220px;object-fit:contain;background:#fff;border-radius:8px;padding:6px"></div>`:`<div class="muted" style="margin-top:7px">Belum ada tanda tangan tersimpan.</div>`}
      </div>
      <label class="checkbox-item" style="margin:10px 0;border-color:${sigEnabled?'rgba(53,199,154,.45)':'rgba(255,255,255,.10)'}"><input type="checkbox" data-signature-user="${escAttr(u)}" ${sigEnabled?'checked':''}> ✍️ Izinkan <b>Checklist Tanda Tangan Cetak</b> untuk akun ini</label>
      <div class="permission-scroll">${checks}</div>
    </div>`;
  }

  function renderAccess(){
    const g=guardOwner(); if(g)return g;
    return `<div class="card"><div class="card-head"><div><h3>Hak Akses Admin & Divisi</h3><div class="desc">Owner adalah satu-satunya pihak yang menentukan hak akses. Perubahan disimpan permanen melalui PHP/MySQL.</div></div><button class="btn btn-em" onclick="saveMasterPermissions()">🔐 Simpan Hak Akses</button></div>
      <h4>Admin 1–10</h4><div class="owner-grid">${ADMIN10.map((u,i)=>permissionCard(u,'Admin '+(i+1))).join('')}</div>
      <h4 style="margin-top:22px">Divisi 1–10</h4><div class="owner-grid">${DIV10.map((u,i)=>permissionCard(u,'Divisi '+(i+1)+' — '+(DB.users[u]?.divisionName||defaultDivNames[i]))).join('')}</div>
    </div>`;
  }

  function waUrl(phone,name,ket){
    if(!phone)return '';
    let n=String(phone).replace(/\D/g,'');
    if(n.startsWith('0'))n='62'+n.slice(1);
    if(n.length<9)return '';
    const text=encodeURIComponent(`Halo ${name||''}, ${ket||'terkait transaksi/data ERP'}`);
    return `https://wa.me/${n}?text=${text}`;
  }

  function renderWhatsApp(){
    const g=guardOwner(); if(g)return g;
    const users=[...ADMIN10,...DIV10].map(u=>[u,DB.users[u]]).filter(x=>x[1]&&x[1].phone);
    const rows=users.map(([u,r])=>{
      const link=waUrl(r.phone,r.name,r.jabatan||r.divisionName||'');
      return `<tr><td>${esc(r.name||u)}</td><td>${esc(u)}</td><td>${esc(r.jabatan||r.divisionName||'-')}</td><td>${esc(r.phone)}</td><td>${link?`<a class="btn btn-sm btn-em wa-link" href="${link}" target="_blank" rel="noopener">💬 Chat WhatsApp</a>`:'-'}</td></tr>`;
    }).join('') || `<tr><td colspan="5"><div class="empty-state">Belum ada nomor WhatsApp Admin/Divisi.</div></td></tr>`;
    return `<div class="card"><div class="card-head"><div><h3>WhatsApp & Kontak</h3><div class="desc">Setiap nomor dapat dibuka langsung ke WhatsApp. Keterangan transaksi dapat ikut menjadi isi pesan.</div></div></div>
      <table class="wa-table"><thead><tr><th>Nama</th><th>Akun</th><th>Jabatan/Divisi</th><th>WhatsApp</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="card" style="margin-top:16px"><h4>Uji pesan berdasarkan keterangan</h4>
        <div class="form-grid">
          <div class="form-field"><label>No. WhatsApp</label><input id="wa_test_phone" placeholder="0812..."></div>
          <div class="form-field"><label>Nama Kontak</label><input id="wa_test_name" placeholder="Nama"></div>
          <div class="form-field"><label>Keterangan / Transaksi</label><input id="wa_test_ket" placeholder="Contoh: Invoice INV-001 jatuh tempo"></div>
        </div>

    if(!rec||rec.password!==pass||rec.aktif===false){
      err.textContent='Username/password salah atau akun tidak aktif.';
      return;
    }
    if(rec.role!=='master'){
      err.textContent='Halaman Owner hanya untuk akun Owner / Master. Silakan gunakan login.html Admin & Divisi.';
      return;
    }
    if(!['master','admin','division'].includes(rec.role)){
      if(typeof oldLogin==='function')return oldLogin.apply(this,arguments);
      err.textContent='Role akun tidak diizinkan.';return;

    session={role:rec.role,name:rec.name||entered,user:entered,page:APP_PAGE,divisionNo:rec.divisionNo||null};

  // Restore session universal, supaya admin/divisi tidak terikat APP_USER owner.
  function restoreUniversalSession(){
    let ss=null;try{ss=JSON.parse(sessionStorage.getItem('erp:session:'+APP_PAGE)||'null')}catch(e){}
    if(!ss||!DB.users[ss.user])return false;
    const r=DB.users[ss.user];
    if(r.password===undefined||r.aktif===false)return false;
    session=ss;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('roleLabel').textContent=r.name||ss.user;

    if(rt){rt.textContent=r.role==='master'?'MASTER':r.role==='division'?'DIVISI '+(r.divisionNo||''):'ADMIN';rt.className='tag '+(r.role==='master'?'tag-gold':'tag-green');}
    buildNav();

    return true;

  // WhatsApp pintar: semua kontak yang memiliki phone mendapat href dengan keterangan.
  const oldFormatWA=window.formatWA;
  window.formatWA=function(kontak,nama,ket){
    if(!kontak)return '-';
    let num=String(kontak).replace(/\D/g,'');if(num.startsWith('0'))num='62'+num.slice(1);
    if(num.length<9)return esc(kontak);
    const text=encodeURIComponent(`Halo ${nama||''}, ${ket||'terkait transaksi/data ERP'}`);
    return `<a href="https://wa.me/${num}?text=${text}" target="_blank" rel="noopener" class="btn btn-sm btn-wa" style="text-decoration:none">💬 WhatsApp</a>`;
  };

  // Jika transaksi memiliki nomor kontak/telepon, otomatis sediakan tombol WA pada kolom.
  // Hook ini tidak mengubah data lama; hanya menyediakan helper untuk renderer transaksi yang sudah ada.
  window.waTransactionHref=function(phone,nama,ket){return waUrl(phone,nama,ket);};

  // Tambahkan menu master dan persist initial accounts sekali.
  setTimeout(async function(){
    try{
      ensureOwnerDivisionDB();
      if(session && session.role==='master')buildNav();
      await saveDB();

})();

<script>
(function(){
'use strict';

/* ===================== PAYROLL & TANDA TANGAN (terintegrasi Akun User) =====================
   Pengganti "Enterprise Center" lama. Tidak ada overlay/FAB, tidak ada endpoint API baru.
   Karyawan = 10 akun Admin (admin1..admin10) + 10 akun Divisi (divisi1..divisi10) yang SUDAH ADA.
   Setiap pembayaran gaji dicatat lewat postJurnal()/DB.kasbank yang sama dengan modul utama,
   sehingga otomatis tampil di "Kas & Bank", "Jurnal Umum", dan "Riwayat Transaksi".
================================================================================================ */

function pcEnsure(){
  if(!DB) return;
  DB.overtime = Array.isArray(DB.overtime) ? DB.overtime : [];
  DB.payroll = Array.isArray(DB.payroll) ? DB.payroll : [];
  DB.settings = DB.settings || {};
  DB.settings.signatureSlots = Array.isArray(DB.settings.signatureSlots) ? DB.settings.signatureSlots.slice(0,6) : [];
}

function pcEmployeeUsernames(){
  const admins = Array.from({length:10},(_,i)=>'admin'+(i+1));
  const divs = Array.from({length:10},(_,i)=>'divisi'+(i+1));
  return [...admins, ...divs].filter(u=>DB.users && DB.users[u]);
}
function pcEmployeeList(){
  return pcEmployeeUsernames().map(u=>{
    const r=DB.users[u]||{};
    return {username:u, name:r.name||u, jabatan:r.jabatan||r.divisionName||(r.role==='division'?'Divisi':'Admin'), role:r.role, salary:Number(r.salary)||0, aktif:r.aktif!==false};
  });
}

window._pcTab = window._pcTab || 'karyawan';

function renderEnterpriseCenter(){
  pcEnsure();
  const tabs=[['karyawan','Karyawan'],['lembur','Lembur'],['payroll','Payroll'],['slip','Slip Gaji'],['ttd','Tanda Tangan']];

  const body = ({
    karyawan: renderPCKaryawan,
    lembur: renderPCLembur,
    payroll: renderPCPayroll,
    slip: renderPCSlip,

}

window.pcSetTab = function(t){ window._pcTab=t; render(); };

/* ---- Karyawan (baca dari akun yang sudah ada; hanya gaji pokok yang diedit di sini) ---- */
function renderPCKaryawan(){
  const list = pcEmployeeList();
  const rows = list.map(e=>`<tr><td><b>${safeText(e.name)}</b><div class="desc">${safeText(e.username)}</div></td><td>${safeText(e.jabatan)}</td><td><span class="tag ${e.role==='division'?'tag-gold':'tag-green'}">${e.role==='division'?'Divisi':'Admin'}</span></td><td>${e.aktif?'<span class="tag tag-green">Aktif</span>':'<span class="tag tag-red">Nonaktif</span>'}</td><td><input type="number" id="sal_${e.username}" value="${e.salary}" style="width:130px;padding:6px 8px;border-radius:8px;border:1px solid var(--line)"></td></tr>`).join('') || `<tr><td colspan="5"><div class="empty-state">Belum ada akun Admin/Divisi. Buat dulu di menu "10 Akun Admin" / "10 Akun Divisi".</div></td></tr>`;
  return `<div class="card"><div class="card-head"><div><h3>Karyawan (Admin &amp; Divisi)</h3><div class="desc">Daftar ini otomatis mengikuti akun Admin 1-10 dan Divisi 1-10 yang sudah ada. Penambahan/penonaktifan akun dilakukan di menu Owner terkait, bukan di sini.</div></div><button class="btn btn-em" onclick="pcSaveSalaries()">Simpan Gaji Pokok</button></div><table><thead><tr><th>Nama</th><th>Jabatan</th><th>Tipe</th><th>Status</th><th>Gaji Pokok</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  pcEmployeeList().forEach(e=>{

  });
  await saveDB(); toast('Gaji pokok tersimpan','ok'); render();
};

/* ---- Lembur ---- */
function renderPCLembur(){
  const list=pcEmployeeList();
  const opts=list.map(e=>`<option value="${e.username}">${safeText(e.name)}</option>`).join('');

  }).join('') || `<tr><td colspan="6"><div class="empty-state">Belum ada data lembur.</div></td></tr>`;

window.pcAddOvertime = async function(){
  const emp=val('otEmp'); if(!emp) return toast('Belum ada karyawan','err');
  const hours=Number(val('otHours'))||0, rate=Number(val('otRate'))||0;
  if(!hours||!rate) return toast('Isi jam dan tarif','err');
  DB.overtime.push({id:uid('OT'), employeeId:emp, date:val('otDate')||todayStr(), hours, rate, note:val('otNote')||''});
  await saveDB(); toast('Lembur tercatat','ok'); render();
};

/* ---- Payroll: hitung + bayar (masuk Kas & Bank -> Jurnal -> Riwayat Transaksi) ---- */
function pcOvertimeTotal(username, period){
  return (DB.overtime||[]).filter(o=>o.employeeId===username && String(o.date||'').slice(0,7)===period).reduce((s,o)=>s+(Number(o.hours)||0)*(Number(o.rate)||0),0);

function renderPCPayroll(){

  const rows=(DB.payroll||[]).filter(p=>p.period===period).map(p=>`<tr><td>${safeText(p.name)}</td><td class="num">${fmtIDR(p.gajiPokok)}</td><td class="num">${fmtIDR(p.lembur)}</td><td class="num">${fmtIDR(p.potongan)}</td><td class="num" style="font-weight:700">${fmtIDR(p.net)}</td><td>${p.status==='Dibayar'?'<span class="tag tag-green">Dibayar</span>':'<span class="tag tag-gold">Belum Dibayar</span>'}</td><td>${p.status!=='Dibayar'?`<button class="btn btn-em btn-sm" onclick="pcBayarPayroll('${p.id}')">Bayar</button>`:'-'}</td></tr>`).join('') || `<tr><td colspan="7"><div class="empty-state">Belum ada perhitungan payroll untuk periode ini. Klik Hitung Payroll.</div></td></tr>`;
  return `<div class="card"><div class="card-head"><div><h3>Payroll</h3><div class="desc">Gaji Pokok (dari tab Karyawan) + Lembur periode ini − Potongan manual.</div></div></div>
  <div class="form-grid"><div class="form-field"><label>Periode</label><input type="month" value="${period}" onchange="window._pcPeriod=this.value;render()"></div><div class="form-field"><label>Potongan per Karyawan (opsional)</label><input id="pcDeduction" type="number" value="0"></div><div class="form-field"><label>Bayar Melalui Akun</label><select id="pcAkun"><option value="1100">Kas Tunai</option><option value="1101">Bank BCA</option><option value="1102">Bank BRI</option></select></div></div>
  <div style="margin-top:10px"><button class="btn btn-em" onclick="pcHitungPayroll()">Hitung Payroll Periode Ini</button></div></div>
  <div class="card"><table><thead><tr><th>Karyawan</th><th>Gaji Pokok</th><th>Lembur</th><th>Potongan</th><th>Gaji Bersih</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
window.pcHitungPayroll = async function(){
  const period = window._pcPeriod || todayStr().slice(0,7);
  const deduction = Number(val('pcDeduction'))||0;
  const list = pcEmployeeList().filter(e=>e.aktif);
  if(!list.length) return toast('Belum ada karyawan aktif','err');
  list.forEach(e=>{
    const lembur = pcOvertimeTotal(e.username, period);
    const gajiPokok = e.salary;
    const net = Math.max(0, gajiPokok + lembur - deduction);
    let row = DB.payroll.find(p=>p.period===period && p.username===e.username);
    if(!row){ row = {id:uid('PR'), period, username:e.username, name:e.name, status:'Belum Dibayar'}; DB.payroll.push(row); }
    if(row.status!=='Dibayar'){ row.gajiPokok=gajiPokok; row.lembur=lembur; row.potongan=deduction; row.net=net; }
  });
  await saveDB(); toast('Payroll periode '+period+' dihitung','ok'); render();
};
window.pcBayarPayroll = async function(id){
  const p = (DB.payroll||[]).find(x=>x.id===id);
  if(!p || p.status==='Dibayar') return;
  const akun = val('pcAkun')||'1100';
  const namaAkun = {'1100':'Kas Tunai','1101':'Bank BCA','1102':'Bank BRI'}[akun];
  const tgl = todayStr();
  const rec = {id:uid('KB'), tanggal:tgl, akun, akunNama:namaAkun, tipe:'keluar', jumlah:p.net, keterangan:'Pembayaran Gaji '+p.name+' periode '+p.period, status:autoStatus(tgl)};
  DB.kasbank.push(rec);
  const j = postJurnal(tgl, rec.keterangan, [], 'kasbank', rec.id, rec.status);
  j.entries = [{akun:'5200', debit:p.net, kredit:0},{akun, debit:0, kredit:p.net}];
  j.totalDebit=p.net; j.totalKredit=p.net; j.balanced=true;
  p.status='Dibayar'; p.dibayarPada=new Date().toISOString(); p.dibayarOleh=session.user; p.kasbankId=rec.id;
  await saveDB(); buildNav(); toast('Gaji '+p.name+' dibayar & tercatat di Riwayat Transaksi','ok'); render();
};

/* ---- Slip Gaji: pratinjau lalu cetak lewat mesin cetak A4 bawaan aplikasi ---- */
function renderPCSlip(){
  const rows=(DB.payroll||[]).slice().reverse().map(p=>`<tr><td>${safeText(p.period)}</td><td>${safeText(p.name)}</td><td class="num">${fmtIDR(p.net)}</td><td>${p.status==='Dibayar'?'<span class="tag tag-green">Dibayar</span>':'<span class="tag tag-gold">Belum Dibayar</span>'}</td><td><button class="btn btn-sm" onclick="pcPreviewSlip('${p.id}')">Pratinjau &amp; Cetak</button></td></tr>`).join('') || `<tr><td colspan="5"><div class="empty-state">Belum ada payroll.</div></td></tr>`;
  const preview = window._pcSlipId ? pcSlipHtml(window._pcSlipId) : '';
  return `<div class="card no-print"><div class="card-head"><div><h3>Slip Gaji</h3><div class="desc">Pilih baris untuk pratinjau, lalu gunakan tombol 🖨 Cetak di atas halaman (memakai mesin cetak A4 bawaan aplikasi, sama seperti laporan lain).</div></div></div><table><thead><tr><th>Periode</th><th>Karyawan</th><th>Gaji Bersih</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${preview}`;
}
window.pcPreviewSlip = function(id){ window._pcSlipId = id; render(); };
function pcSlipHtml(id){
  const p=(DB.payroll||[]).find(x=>x.id===id); if(!p) return '';
  const slots = (DB.settings.signatureSlots||[]).filter(u=>DB.users[u]);
  const sigHtml = slots.length ? `<div class="sig-print">${slots.map(u=>{const r=DB.users[u]; const s=r.signature||''; return `<div class="sig-box">${s?`<img src="${s}">`:'<div class="sig-x">✓</div>'}<b>${safeText(r.name||u)}</b><br>${safeText(r.jabatan||'')}</div>`}).join('')}</div>` : '';
  return `<div class="print-area"><div class="print-head"><h2>SLIP GAJI</h2><div>${safeText((DB.company&&DB.company.name)||PRINT_COMPANY_NAME)} · Periode ${safeText(p.period)}</div></div>
  <table><thead><tr><th>Komponen</th><th>Nilai</th></tr></thead><tbody>
  <tr><td>Nama Karyawan</td><td>${safeText(p.name)}</td></tr>
  <tr><td>Gaji Pokok</td><td class="num">${fmtIDR(p.gajiPokok)}</td></tr>
  <tr><td>Lembur</td><td class="num">${fmtIDR(p.lembur)}</td></tr>
  <tr><td>Potongan</td><td class="num">-${fmtIDR(p.potongan)}</td></tr>
  <tr><td><b>Gaji Bersih</b></td><td class="num"><b>${fmtIDR(p.net)}</b></td></tr>
  </tbody></table>${sigHtml}<div class="print-foot"><span>Status: ${safeText(p.status)}</span><span>Dicetak: ${fmtDate(todayStr())}</span></div></div>`;
}

/* ---- 6 Slot Tanda Tangan terintegrasi Akun User (owner/admin/divisi) ---- */
function pcAllAccounts(){
  const arr=['owner', ...pcEmployeeUsernames()];
  return arr.filter(u=>DB.users && DB.users[u]);
}
function renderPCSignature(){
  const accounts = pcAllAccounts();
  const optionsFor = a => accounts.map(u=>`<option value="${u}" ${a===u?'selected':''}>${safeText((DB.users[u]||{}).name||u)}</option>`).join('');
  const slots = DB.settings.signatureSlots || [];
  const rows = Array.from({length:6}).map((_,i)=>{
    const u = slots[i]||'';
    const sig = (u && DB.users[u]) ? DB.users[u].signature : '';
    return `<div class="owner-card">
      <label style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase">Slot ${i+1}</label>
      <select id="ttdSlot_${i}" style="width:100%;margin:6px 0;padding:8px;border-radius:8px;border:1px solid var(--line)"><option value="">- Kosong -</option>${optionsFor(u)}</select>
      ${sig?`<img src="${sig}" style="height:50px;max-width:160px;object-fit:contain;background:#fff;border-radius:6px;padding:4px;border:1px solid var(--line)">`:'<div class="muted">Belum ada tanda tangan diunggah untuk akun ini.</div>'}
      ${u?`<div style="margin-top:8px"><label class="btn btn-sm">Unggah Tanda Tangan<input type="file" accept="image/png,image/jpeg" style="display:none" onchange="pcUploadSignature('${u}',this.files[0])"></label></div>`:''}
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-head"><div><h3>Tanda Tangan (Maks 6 Slot)</h3><div class="desc">Pilih hingga 6 akun (Owner/Admin/Divisi) yang tanda tangannya tampil pada Slip Gaji. Tanda tangan tersimpan langsung di akun pengguna terkait — akun yang sama juga dipakai fitur tanda tangan di halaman lain.</div></div><button class="btn btn-em" onclick="pcSaveSignatureSlots()">Simpan Slot</button></div><div class="owner-grid">${rows}</div></div>`;
}
window.pcSaveSignatureSlots = async function(){
  const arr=[];
  for(let i=0;i<6;i++){ const v=val('ttdSlot_'+i); if(v) arr.push(v); }
  DB.settings.signatureSlots = arr;
  await saveDB(); toast('Slot tanda tangan tersimpan','ok'); render();
};
window.pcUploadSignature = async function(u,file){
  if(!file) return;
  if(!/^image\/(png|jpeg)$/.test(file.type)) return toast('Tanda tangan harus PNG/JPG','err');
  const data = await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  if(!DB.users[u]) return;
  DB.users[u].signature = data;
  await saveDB(); toast('Tanda tangan tersimpan','ok'); render();
};

setTimeout(()=>{ try{ pcEnsure(); }catch(e){ console.error('Payroll module init',e); } }, 0);
})();
</script>

        class="enterprise-save-box"
        role="status"
        aria-live="polite"
    >

                document.getElementById('enterpriseLoadingFallback').style.display='block';
            "
        >

            id="enterpriseLoadingFallback"

        ></div>

        </div>

        <div
            id="enterpriseSaveTitle"
            class="enterprise-save-title"
        >
