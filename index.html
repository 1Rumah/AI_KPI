    <!-- ========================================================== -->
<style>
:root{
  --navy-950:#0a1420;
  --navy-900:#0e1b2c;
  --navy-800:#132538;
  --navy-700:#1b3350;
  --navy-600:#25456b;
  --emerald:#16a878;
  --emerald-dark:#0e7c5a;
  --gold:#c9a227;
  --gold-soft:#e8c766;
  --paper:#2852c1;
  --paper-dim:#ece8de;
  --ink:#1c2430;
  --ink-soft:#5b6572;
  --red:#c94b3f;
  --line:rgba(28,36,48,.08);
  --glass-bg:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.6);
  --radius:14px;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(22,168,120,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(201,162,39,.10), transparent 55%),
    var(--paper);
  color:#ffba0d;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-soft);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(19,37,56,.25);border-radius:8px;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px;}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 500px at 20% 0%, rgba(22,168,120,.35), transparent 60%),
    radial-gradient(900px 600px at 90% 100%, rgba(201,162,39,.25), transparent 55%),
    linear-gradient(160deg,var(--navy-950),var(--navy-900) 55%,var(--navy-800));
  padding:24px;
}
.login-card{
  width:100%;max-width:420px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:20px;padding:38px 34px 30px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
  animation:riseIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.brand-mark{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,var(--emerald),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#0a1420;font-size:18px;margin-bottom:16px;
  box-shadow:0 8px 24px -8px rgba(22,168,120,.6);
}
.login-card h1{color:#fff;font-size:22px;margin:0 0 4px;letter-spacing:-.3px;}
.login-card p.sub{color:rgba(255,255,255,.55);font-size:13px;margin:0 0 26px;}
.role-toggle{display:flex;gap:8px;margin-bottom:18px;background:rgba(255,255,255,.06);padding:4px;border-radius:11px;}
.role-toggle button{
  flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;color:rgba(255,255,255,.6);
  font-size:12.5px;font-weight:600;letter-spacing:.3px;transition:.2s;
}
.role-toggle button.active{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;box-shadow:0 6px 16px -6px rgba(22,168,120,.7);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:rgba(255,255,255,.55);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase;}
.field input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;transition:.15s;
}
.field input:focus{border-color:var(--emerald);background:rgba(255,255,255,.09);}
.btn-primary{
  width:100%;padding:12px 0;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));
  color:#fff;font-weight:700;font-size:14px;letter-spacing:.3px;margin-top:6px;
  box-shadow:0 10px 24px -8px rgba(22,168,120,.6);transition:transform .15s;
}
.btn-primary:hover{transform:translateY(-1px);}
.login-hint{margin-top:18px;font-size:11.5px;color:rgba(255,255,255,.4);line-height:1.6;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.login-err{color:#ff9d8f;font-size:12.5px;margin-top:10px;min-height:14px;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:246px;flex-shrink:0;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,var(--navy-950),var(--navy-900) 60%,var(--navy-800));
  color:#fff;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease;
  border-right:1px solid rgba(255,255,255,.06);
}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;}
.side-brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--emerald),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a1420;font-size:14px;}
.side-brand .txt div:first-child{font-weight:800;font-size:14.5px;letter-spacing:-.2px;}
.side-brand .txt div:last-child{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.5px;}
.side-role{margin:0 18px 14px;padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.65);display:flex;justify-content:space-between;align-items:center;}
.side-role b{color:#fff;}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 12px 12px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.32);margin:16px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.72);
  font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:.15s;border:1px solid transparent;
}
.nav-item .ic{width:17px;text-align:center;font-size:13px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:linear-gradient(135deg,rgba(22,168,120,.25),rgba(22,168,120,.08));color:#fff;border-color:rgba(22,168,120,.35);}
.nav-item.active .ic{color:var(--emerald);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700;}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);}
.logout-btn{width:100%;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;}
.logout-btn:hover{background:rgba(201,75,63,.18);border-color:rgba(201,75,63,.4);color:#ffb3a8;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hamburger{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;font-size:16px;}
.topbar h2{font-size:17px;margin:0;letter-spacing:-.3px;}
.topbar .sub{font-size:12px;color:var(--ink-soft);}
.topbar-spacer{flex:1;}
.date-pill{font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:20px;}
.ai-btn{
  display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:20px;border:none;
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;font-size:12.5px;font-weight:700;
  box-shadow:0 8px 20px -8px rgba(19,37,56,.6);
}
.ai-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);box-shadow:0 0 8px var(--gold-soft);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.content{padding:24px 26px 60px;max-width:1400px;}

/* ---------- COMPONENTS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:17px 18px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;
}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -14px rgba(19,37,56,.25);}
.kpi-card .accent{position:absolute;top:0;left:0;right:0;height:3px;}
.kpi-card .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.kpi-card .val{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.kpi-card .delta{font-size:11.5px;margin-top:5px;color:var(--ink-soft);}

.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(19,37,56,.03);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:15px;margin:0;letter-spacing:-.2px;}
.card-head .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;transition:.15s;}
.btn:hover{background:var(--paper-dim);}
.btn-em{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;border:none;box-shadow:0 6px 16px -6px rgba(22,168,120,.55);}
.btn-em:hover{filter:brightness(1.05);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a9821c);color:#fff;border:none;}
.btn-red{background:rgba(201,75,63,.08);color:var(--red);border:1px solid rgba(201,75,63,.25);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;padding:9px 10px;color:var(--ink-soft);font-weight:700;font-size:10.8px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:rgba(22,168,120,.035);}
.tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px;}
.tag-green{background:rgba(22,168,120,.12);color:var(--emerald-dark);}
.tag-red{background:rgba(201,75,63,.1);color:var(--red);}
.tag-gold{background:rgba(201,162,39,.15);color:#8a6d17;}
.tag-gray{background:rgba(28,36,48,.08);color:var(--ink-soft);}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.form-field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.form-field input,.form-field select,.form-field textarea{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:var(--paper);outline:none;transition:.15s;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--emerald);background:#fff;box-shadow:0 0 0 3px rgba(22,168,120,.12);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,20,32,.55);backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;animation:riseIn .25s;}
.modal h3{margin:0 0 4px;font-size:16px;}
.modal .mclose{position:absolute;}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:28px;margin-bottom:8px;}

.pill-list{display:flex;flex-wrap:wrap;gap:8px;}
.kw-pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);padding:6px 6px 6px 13px;border-radius:20px;font-size:12.5px;}
.kw-pill button{border:none;background:rgba(201,75,63,.12);color:var(--red);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px;margin-top:8px;}
.checkbox-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:8px 11px;border-radius:9px;cursor:pointer;}
.checkbox-item input{accent-color:var(--emerald);width:15px;height:15px;flex-shrink:0;}

.analysis-panel{background:linear-gradient(160deg,var(--navy-950),var(--navy-800));color:#fff;border-radius:16px;padding:22px 24px;position:relative;overflow:hidden;}
.ai-panel::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(22,168,120,.35),transparent 70%);}
.ai-panel::after{content:'';position:absolute;bottom:-60px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(201,162,39,.25),transparent 70%);}
.ai-body{position:relative;z-index:1;}
.analysis-loading{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);font-size:13px;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--emerald);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-text{white-space:pre-wrap;line-height:1.7;font-size:13.5px;color:rgba(255,255,255,.92);}

.jv-row{display:grid;grid-template-columns:2fr 1fr 1fr 30px;gap:8px;margin-bottom:8px;align-items:center;}
.balance-check{padding:10px 14px;border-radius:9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;margin-top:6px;}
.balance-ok{background:rgba(22,168,120,.12);color:var(--emerald-dark);}
.balance-bad{background:rgba(201,75,63,.1);color:var(--red);}

.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-900);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:riseIn .25s;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--emerald-dark);}

.overlay{display:none;position:fixed;inset:0;background:rgba(10,20,32,.5);z-index:35;}
.overlay.show{display:block;}

@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);width:250px;box-shadow:20px 0 60px rgba(0,0,0,.35);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .content{padding:18px 14px 70px;}
  .topbar{padding:12px 14px;}
  .form-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:520px){
  .form-grid{grid-template-columns:1fr;}
  .jv-row{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}

/* ---------- NOTIFICATION BELL ---------- */
.notif-btn{position:relative;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:8px;}
.notif-dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff;}
.notif-panel{position:absolute;right:14px;top:56px;width:320px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -16px rgba(0,0,0,.35);z-index:80;max-height:70vh;overflow:auto;display:none;}
.notif-panel.show{display:block;}
.notif-item{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;}
.notif-item:hover{background:var(--paper-dim);}
.notif-item b{display:block;font-size:12.5px;margin-bottom:2px;}
.notif-empty{padding:22px 14px;text-align:center;color:var(--ink-soft);font-size:12.5px;}

/* ---------- PENGAJUAN & PESAN ---------- */
.req-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.req-card .req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.req-note{background:var(--paper-dim);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px;color:var(--ink-soft);}
.msg-bubble{background:linear-gradient(135deg,rgba(22,168,120,.08),rgba(201,162,39,.08));border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
.msg-bubble .meta{font-size:11px;color:var(--ink-soft);margin-top:6px;}
.unread-badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:1px 7px;margin-left:6px;}

/* ---------- PRINT / LAPORAN A4 ---------- */
.print-area{background:#fff;padding:14mm;border-radius:10px;border:1px solid var(--line);}
.print-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;}
.print-head h2{margin:0 0 2px;font-size:18px;letter-spacing:.3px;}
.print-head div{font-size:12px;color:var(--ink-soft);}
.print-foot{margin-top:26px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
@media print{
  body *{visibility:hidden;}
  .print-area, .print-area *{visibility:visible;}
  .print-area{position:absolute;left:0;top:0;width:210mm;min-height:297mm;padding:14mm;border:none;border-radius:0;margin:0;}
  @page{size:A4;margin:0;}
}
/* ---------- UNIVERSAL PRINT SYSTEM ---------- */
.page-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;padding:10px 12px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:12px}
.print-filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}.print-filters>div:first-child{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.print-filters>div:first-child b{font-size:12.5px}.print-filters>div:first-child span{font-size:10.5px;color:var(--ink-soft)}.print-filter-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px}.print-filter-grid .form-field{margin:0}.print-filter-grid label{font-size:9.5px}.print-filter-grid input,.print-filter-grid select{padding:7px 8px;font-size:11px}@media(max-width:1000px){.print-filter-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.print-filter-grid{grid-template-columns:repeat(2,1fr)}}

.page-toolbar b{font-size:13px}.page-toolbar span{font-size:11px;color:var(--ink-soft)}
.universal-print-header,.universal-print-footer{display:none}
.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0}
.analysis-kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:16px}
.analysis-panel{background:linear-gradient(160deg,var(--navy-950),var(--navy-800));color:#fff;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;margin-top:16px}
.analysis-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.analysis-panel h3{margin:0 0 4px;font-size:17px}.analysis-panel-head div div{font-size:12.5px;color:rgba(255,255,255,.65)}

/* =========================================================
   LOGIN PEMBUKUAN - PROFESSIONAL GLASSMORPHISM
   ========================================================= */

:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --text: #ffffff;
  --muted: rgba(255,255,255,.72);
  --glass: rgba(255,255,255,.12);
  --glass-border: rgba(255,255,255,.22);
  --input-bg: rgba(255,255,255,.10);
  --shadow: 0 25px 70px rgba(0,0,0,.35);
}

/* RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color: var(--text);

  /* Background utama */
  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(37, 99, 235, .45),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(124, 58, 237, .40),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #07111f 0%,
      #0f1d35 45%,
      #111827 100%
    );

  overflow-x: hidden;
}

/* Background dekoratif */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(10px);
  z-index: 0;
}

body::before {
  width: 280px;
  height: 280px;
  top: -100px;
  left: -80px;
  background: ;
}

body::after {
  width: 350px;
  height: 350px;
  right: -120px;
  bottom: -120px;
  background: ;
}


/* =========================================================
   LOGIN SCREEN
   ========================================================= */

#loginScreen {
  position: relative;
  z-index: 1;

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px 18px;

  background:
    linear-gradient(
      135deg,
      rgba(15,23,42,.35),
      rgba(30,41,59,.15)
    );
}


/* =========================================================
   LOGIN CARD
   ========================================================= */

.login-card {
  width: min(430px, 100%);

  padding: 38px 36px 32px;

  border-radius: 24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.17),
      rgba(255,255,255,.07)
    );

  border: 1px solid var(--glass-border);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.15);

  position: relative;

  overflow: hidden;

  animation: loginAppear .65s ease both;
}


/* Efek cahaya pada card */
.login-card::before {
  content: "";

  position: absolute;
  top: 0;
  left: 0;
  right: 0;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.7),
      transparent
    );
}


/* =========================================================
   HEADER
   ========================================================= */

.login-card h3 {
  text-align: center;

  font-size: 23px;
  font-weight: 800;

  letter-spacing: .8px;

  color: #ffffff;

  margin-bottom: 8px;

  text-shadow:
    0 3px 15px rgba(0,0,0,.3);
}

.login-card h4 {
  text-align: center;

  font-size: 14px;
  font-weight: 400;

  color: var(--muted);

  margin-bottom: 30px;
}


/* =========================================================
   FIELD
   ========================================================= */

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;

  margin-bottom: 8px;

  font-size: 13px;
  font-weight: 600;

  color: rgba(255,255,255,.85);

  letter-spacing: .3px;
}

.field input {
  width: 100%;

  height: 52px;

  padding: 0 16px;

  border-radius: 13px;

  border: 1px solid rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.09);

  color: #ffffff;

  font-size: 15px;

  outline: none;

  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    transform .25s ease;

  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.12);
}

.field input::placeholder {
  color: rgba(255,255,255,.38);
}

.field input:hover {
  background:
    rgba(255,255,255,.13);
}

.field input:focus {
  border-color:
    rgba(96,165,250,.9);

  background:
    rgba(255,255,255,.14);

  box-shadow:
    0 0 0 4px rgba(37,99,235,.16),
    0 8px 25px rgba(0,0,0,.12);

  transform: translateY(-1px);
}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.btn-primary {
  width: 100%;

  height: 53px;

  margin-top: 8px;

  border: none;
  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #3b82f6,
      #2563eb
    );

  color: #ffffff;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: .2px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(37,99,235,.32);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.btn-primary:hover {
  transform: translateY(-2px);

  filter: brightness(1.08);

  box-shadow:
    0 15px 32px rgba(37,99,235,.42);
}

.btn-primary:active {
  transform: translateY(0);

  box-shadow:
    0 7px 18px rgba(37,99,235,.28);
}


/* =========================================================
   ERROR LOGIN
   ========================================================= */

.login-err {
  min-height: 20px;

  margin-top: 13px;

  text-align: center;

  color: #fca5a5;

  font-size: 13px;
  font-weight: 500;

  line-height: 1.5;
}


/* =========================================================
   BANTUAN WHATSAPP
   ========================================================= */

.login-card .sub {
  margin-top: 23px;

  padding-top: 20px;

  border-top:
    1px solid rgba(255,255,255,.10);

  text-align: center;

  font-size: 12px;

  color: rgba(255,255,255,.55);

  line-height: 1.8;
}

.login-card .sub span {
  display: block;

  margin-bottom: 2px;
}

.login-card .sub a {
  color: #93c5fd;

  font-weight: 600;

  text-decoration: none;

  transition:
    color .2s ease,
    opacity .2s ease;
}

.login-card .sub a:hover {
  color: #bfdbfe;

  text-decoration: underline;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes loginAppear {
  from {
    opacity: 0;
    transform:
      translateY(25px)
      scale(.97);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

  #loginScreen {
    padding: 20px 14px;
  }

  .login-card {
    padding: 32px 23px 27px;

    border-radius: 20px;
  }

  .login-card h3 {
    font-size: 20px;
  }

  .login-card h4 {
    font-size: 13px;

    margin-bottom: 25px;
  }

  .field input {
    height: 50px;
  }

  .btn-primary {
    height: 51px;
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .login-card {
    animation: none;
  }

  .field input,
  .btn-primary,
  .login-card .sub a {
    transition: none;
  }
}

  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.22);

  box-shadow:

  overflow: hidden;

.login-modern-logo img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  padding: 8px;

  display: block;
}

async function loadDB(){
  try{
    const res = await fetch(API_URL + '?action=load', { headers: { 'X-API-KEY': API_KEY } });
    const json = await res.json();
    DB = json && json.value ? JSON.parse(json.value) : defaultDB();
    SERVER_REVISION = Number(json?.revision||0);
    SERVER_UPDATED_AT = String(json?.updated_at||'');
  }catch(e){
    DB = defaultDB();
    toast('Gagal terhubung ke server database anda silahkan hubungi admin');
  }
  // migration safety + akun terpisah Fitri/Riska/Owner
  const d = defaultDB();
  for(const k in d){ if(!(k in DB)) DB[k] = d[k]; }
  if(!DB.users) DB.users = {};
  if(DB.users.admin && !DB.users.fitri){
    DB.users.fitri = { password:'Sukses123', role:'admin', name:'Fitri', permissions:DB.users.admin.permissions ?? null };
  }
  if(DB.users.master && !DB.users.owner){
    DB.users.owner = { password:'Owner@2026', role:'master', name:'Owner / Master' };
  }
  if(!DB.users.riska) DB.users.riska = d.users.riska;
  if(!DB.users.fitri) DB.users.fitri = d.users.fitri;
  if(!DB.users.orhan) DB.users.orhan = d.users.orhan;
  if(!DB.users.siti) DB.users.siti = d.users.siti;
  if(!DB.users.abah) DB.users.abah = d.users.abah;
  if(!DB.users.owner) DB.users.owner = d.users.owner;
  ['fitri','riska','orhan','siti','abah'].forEach(u=>{ if(!Object.prototype.hasOwnProperty.call(DB.users[u],'permissions')) DB.users[u].permissions=null; });
}
let saveTimer=null;
async function saveDB(){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json','X-API-KEY':API_KEY},sessionStorage.getItem('erp:auth_token')?{'Authorization':'Bearer '+sessionStorage.getItem('erp:auth_token')}:{}),
      body: JSON.stringify({ action:'save', value: JSON.stringify(DB), base_revision: SERVER_REVISION, actor: session?.user || APP_USER || 'system', actor_name: session?.name || DB?.users?.[session?.user]?.name || APP_NAME || 'System', actor_role: session?.role || APP_ROLE || 'system', page: APP_PAGE || 'app' })
    });
    if(!res.ok){ const msg = await res.text(); throw new Error('HTTP '+res.status+' '+msg); }
    const saved = await res.json();
    SERVER_REVISION = Number(saved?.revision||SERVER_REVISION);
    SERVER_UPDATED_AT = String(saved?.updated_at||SERVER_UPDATED_AT);
  }catch(e){
    toast('Gagal menyimpan ke database MySQL','err');
    console.error(e);
  }
}
async function checkRealtimeServer(){
  try{
    const res=await fetch(API_URL+'?action=meta',{headers:{'X-API-KEY':API_KEY},cache:'no-store'});
    if(!res.ok)return;
    const meta=await res.json();
    const rev=Number(meta?.revision||0);
    if(!rev || rev===SERVER_REVISION)return;
    // Jangan menimpa form yang sedang diedit pengguna.
    const active=document.activeElement;
    const modal=document.getElementById('modalBg');
    if(active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
    if(modal && modal.classList.contains('show')) return;
    await loadDB();
    if(typeof buildNav==='function')buildNav();
    if(typeof render==='function')render();
    toast('🔄 Data terbaru diterima dari server','ok');
  }catch(e){ console.warn('Realtime sync:',e.message); }
}

  if(realtimeSyncTimer)clearInterval(realtimeSyncTimer);

let manualUpdateBusy = false;

async function updateManualData(){
  if(manualUpdateBusy) return;

  const btn = document.getElementById('manualUpdateBtn');
  const text = btn ? btn.querySelector('.update-text') : null;

  manualUpdateBusy = true;
  if(btn){
    btn.disabled = true;
    btn.classList.add('loading');
    if(text) text.textContent = 'Mengambil data...';
  }

  try{
    await loadDB();

    if(typeof buildNav === 'function') buildNav();
    if(typeof render === 'function') render();

    toast('Data terbaru berhasil dimuat dari server','ok');
  }catch(e){
    console.error('Update manual gagal:', e);
    toast('Update data gagal. Periksa koneksi server.','err');
  }finally{
    manualUpdateBusy = false;
    if(btn){
      btn.disabled = false;
      btn.classList.remove('loading');
      if(text) text.textContent = 'Update Data';
    }
  }
}

/* ===================== HOURLY NOTIFICATION CHIME ===================== */
let notifTimer=null;
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(t=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.16);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
    });
  }catch(e){}
}
function startHourlyChime(){
  if(notifTimer) clearInterval(notifTimer);
  notifTimer = setInterval(()=>{
    const n = getNotifItems();
    if(n.length){ beep(); toast('🔔 Ada '+n.length+' notifikasi belum dibuka','err'); }
  }, 3600000); // 1 jam
}

async function doLogout(){
  session = {role:null,name:null};
  await clearSession();
  if(notifTimer) clearInterval(notifTimer);
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';

}
async function restoreSession(){
  const s = await loadSession();
  if(!s || s.page!==APP_PAGE || s.user!==APP_USER || s.role!==APP_ROLE || !DB.users[s.user]) return false;
  session = s;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('roleLabel').textContent = s.name;
  const rt = document.getElementById('roleTag');
  rt.textContent = s.role==='master' ? 'MASTER' : 'ADMIN';
  rt.className = 'tag ' + (s.role==='master' ? 'tag-gold' : 'tag-green');
  document.getElementById('todayPill').textContent = '📅 ' + fmtDate(todayStr());

  startHourlyChime();

/* Notifikasi: Pengajuan & Pesan (per peran) + Jatuh Tempo Piutang/Hutang H-3 (semua peran) */
function getNotifItems(){
  if(!session.role) return [];
  const items = [];
  const now = new Date(todayStr()+'T00:00:00');
  const future3Days = new Date(now);
  future3Days.setDate(now.getDate() + 3);

  // Cek Piutang (Penjualan Kredit) jatuh tempo
  DB.penjualan.forEach(p=>{
    const sisa = p.total - (p.terbayar||0);
    if(p.pembayaranTipe==='Kredit' && sisa>0 && p.jatuhTempo){
      const jt = new Date(p.jatuhTempo+'T00:00:00');
      if(jt < now){
        items.push({ type:'tagihan', id:p.id, text:`🔴 Piutang ${p.mitraNama} SUDAH JATUH TEMPO (${fmtDate(p.jatuhTempo)})`, page:'piutang' });
      } else if(jt <= future3Days){
        items.push({ type:'tagihan', id:p.id, text:`⚠️ Piutang ${p.mitraNama} H-3 Jatuh Tempo!`, page:'piutang' });
      }
    }
  });
  // Cek Hutang (Pembelian Kredit) jatuh tempo
  DB.pembelian.forEach(p=>{
    const sisa = p.total - (p.terbayar||0);
    if(p.pembayaranTipe==='Kredit' && sisa>0 && p.jatuhTempo){
      const jt = new Date(p.jatuhTempo+'T00:00:00');
      if(jt < now){
        items.push({ type:'tagihan', id:p.id, text:`🔴 Hutang ke ${p.mitraNama} SUDAH JATUH TEMPO (${fmtDate(p.jatuhTempo)})`, page:'hutang' });
      } else if(jt <= future3Days){
        items.push({ type:'tagihan', id:p.id, text:`⚠️ Hutang ke ${p.mitraNama} H-3 Jatuh Tempo!`, page:'hutang' });
      }
    }
  });

  if(session.role==='master'){
    DB.pengajuan.filter(p=>p.status==='menunggu').forEach(p=>items.push({
      type:'pengajuan', id:p.id, text:(p.jenis+' — '+p.pemohonNama+' ('+fmtDate(p.tglMulai)+')'), page:'pengajuan'
    }));
  } else if(session.role==='admin'){
    DB.pengajuan.filter(p=>p.status!=='menunggu' && p.dibacaAdmin===false && p.pemohon===session.user).forEach(p=>items.push({
      type:'pengajuan-hasil', id:p.id, text:('Pengajuan '+p.jenis+' Anda: '+(p.status==='disetujui'?'DI ACC':'DI TOLAK')), page:'pengajuan'
    }));
    DB.pesanMaster.filter(m=>m.dibacaAdmin===false).forEach(m=>items.push({
      type:'pesan', id:m.id, text:('Pesan dari Master: '+m.isi.slice(0,60)), page:'pengajuan'
    }));
  }
  return items;
}

function parsePrintedDate(text){
  const m=String(text||'').trim().match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]+)\s+(\d{4})$/); if(!m)return null;
  const months={Jan:0,Feb:1,Mar:2,Apr:3,Mei:4,Jun:5,Jul:6,Agu:7,Sep:8,Okt:9,Nov:10,Des:11}; const key=m[2].slice(0,3); if(!(key in months))return null; const d=new Date(Number(m[3]),months[key],Number(m[1])); return Number.isNaN(d.getTime())?null:d;
}
function applyPrintFilters(){
  const start=parseDateSafe(val('pfStart')), end=parseDateSafe(val('pfEnd')); const type=String(val('pfType')).trim().toLowerCase(), status=String(val('pfStatus')).trim().toLowerCase(), customer=String(val('pfCustomer')).trim().toLowerCase(), supplier=String(val('pfSupplier')).trim().toLowerCase(), product=String(val('pfProduct')).trim().toLowerCase();
  document.querySelectorAll('.page-print-content table tbody tr').forEach(tr=>{
    const cells=[...tr.children].map(td=>td.innerText.trim()), headers=[...(tr.closest('table')?.querySelectorAll('thead th')||[])].map(th=>th.innerText.trim().toLowerCase());
    const idx=(rx)=>headers.findIndex(h=>rx.test(h)); const dateIdx=idx(/tanggal|tgl/), typeIdx=idx(/jenis|tipe/), statusIdx=idx(/status/), customerIdx=idx(/customer|pelanggan/), supplierIdx=idx(/supplier/), productIdx=idx(/produk/);
    let ok=true;
    if(start||end){ const d=parsePrintedDate(cells[dateIdx>=0?dateIdx:0]); if(!d)ok=false; else {if(start&&d<start)ok=false;if(end&&d>end)ok=false;} }
    if(type){ const v=cells[typeIdx>=0?typeIdx:-1]||cells.join(' '); if(!v.toLowerCase().includes(type))ok=false; }
    if(status){ const v=cells[statusIdx>=0?statusIdx:-1]||cells.join(' '); const sv=v.toLowerCase(); const wanted=status==='pending'?'menunggu verifikasi':status; if(!sv.includes(wanted))ok=false; }
    if(customer){ const v=cells[customerIdx>=0?customerIdx:-1]||cells.join(' '); if(!v.toLowerCase().includes(customer))ok=false; }
    if(supplier){ const v=cells[supplierIdx>=0?supplierIdx:-1]||cells.join(' '); if(!v.toLowerCase().includes(supplier))ok=false; }
    if(product){ const v=cells[productIdx>=0?productIdx:-1]||cells.join(' '); if(!v.toLowerCase().includes(product))ok=false; }
    tr.style.display=ok?'':'none';
  });
}

function isBackdated(tgl){ return tgl !== todayStr(); }
function autoStatus(tgl){ return isBackdated(tgl) ? 'pending' : 'posted'; }

function postJurnal(tanggal, keterangan, entries, refType, refId, statusOverride){
  const totalD = entries.reduce((s,e)=>s+(Number(e.debit)||0),0);
  const totalK = entries.reduce((s,e)=>s+(Number(e.kredit)||0),0);
  const j = {
    id: uid('JU'), tanggal, keterangan, entries,
    totalDebit: totalD, totalKredit: totalK,
    balanced: Math.abs(totalD-totalK) < 0.5,
    status: statusOverride || autoStatus(tanggal),
    refType, refId, dibuatOleh: session.user
  };
  DB.jurnal.push(j);
  return j;
}

  let s=0;
  DB.jurnal.filter(j=>j.status!=='ditolak').forEach(j=>{
    j.entries.forEach(e=>{ if(e.akun===kode){ s += (Number(e.debit)||0) - (Number(e.kredit)||0); } });
  });
  return s;
}

/* ===================== DASHBOARD: 4 GRAFIK GARIS 3D ===================== */
const BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function last6Months(){
  const out = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    out.push({ key, label: BULAN_PENDEK[d.getMonth()] + " '" + String(d.getFullYear()).slice(2) });
  }
  return out;
}
/* Plugin kustom: menggambar "dinding" ekstrusi di bawah tiap garis agar tampil seperti grafik garis 3D */
const ribbon3dPlugin = {
  id: 'ribbon3d',
  beforeDatasetsDraw(chart){
    const {ctx} = chart;
    const dx = 7, dy = 9; // arah & kedalaman ekstrusi (px)
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if(!meta || meta.hidden || !meta.data || meta.data.length < 2) return;
      const pts = meta.data.map(p => ({x:p.x, y:p.y}));
      const base = ds.borderColor || '#2563eb';
      for(let i=0;i<pts.length-1;i++){
        const p1 = pts[i], p2 = pts[i+1];
        const grad = ctx.createLinearGradient(p1.x, p1.y, p1.x+dx, p1.y+dy);
        grad.addColorStop(0, hexAlpha(base, 0.32));
        grad.addColorStop(1, hexAlpha(base, 0.06));
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p2.x+dx, p2.y+dy);
        ctx.lineTo(p1.x+dx, p1.y+dy);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }
    });
  }
};
function hexAlpha(hex, a){
  hex = (hex||'#2563eb').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substr(0,2),16)||37, g = parseInt(hex.substr(2,2),16)||99, b = parseInt(hex.substr(4,2),16)||235;
  return `rgba(${r},${g},${b},${a})`;
}
if(window.Chart) Chart.register(ribbon3dPlugin);

let dashCharts = {};
function destroyDashCharts(){
  Object.values(dashCharts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  dashCharts = {};
}
function makeLineChart(canvasId, labels, series, yTickFmt){
  const el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  dashCharts[canvasId] = new Chart(el.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: series.map(s=>({
        label: s.label,
        data: s.data,
        borderColor: s.color,
        backgroundColor: hexAlpha(s.color, 0.12),
        pointBackgroundColor: s.color,
        pointBorderColor: '#fff',
        pointBorderWidth: 1.5,
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 3,
        tension: 0.35,
        fill: true
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, font:{size:11} } },
        tooltip: {
          callbacks: { label: (ctx)=> ` ${ctx.dataset.label}: ${yTickFmt(ctx.parsed.y)}` }
        }
      },
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{size:10.5} } },
        y: { beginAtZero:true, grid:{ color:'#eee' }, ticks:{ font:{size:10}, callback:(v)=>yTickFmt(v,true) } }
      }
    }
  });
}
function fmtRingkas(n, axis){
  n = Number(n)||0;
  if(axis){
    if(Math.abs(n)>=1000000) return (n/1000000).toFixed(n%1000000===0?0:1)+'jt';
    if(Math.abs(n)>=1000) return (n/1000).toFixed(0)+'rb';
    return String(n);
  }
  return fmtIDR(n);
}
function fmtUnit(n){ return Number(n)||0; }
function initDashboardCharts(){
  destroyDashCharts();
  if(!window.Chart){ return; } // Chart.js gagal dimuat (mis. koneksi CDN diblokir) — grafik dilewati secara diam-diam
  const bulan = last6Months();
  const labels = bulan.map(b=>b.label);

  // 1) Penjualan vs Produksi (unit)
  const qtyPenjualan = bulan.map(b => DB.penjualan.filter(t=>monthKey(t.tanggal)===b.key && t.status!=='pending')
    .reduce((s,t)=> s + (t.items||[]).reduce((s2,it)=>s2+(Number(it.qty)||0),0), 0));
  const qtyProduksi = bulan.map(b => DB.produksi.filter(p=>monthKey(p.tanggal)===b.key && p.status!=='pending')
    .reduce((s,p)=> s + (Number(p.qtyJadi)||0), 0));
  makeLineChart('chartPenjualanProduksi', labels, [
    { label:'Penjualan (unit terjual)', data: qtyPenjualan, color:'#2563eb' },
    { label:'Produksi (unit dihasilkan)', data: qtyProduksi, color:'#c9a227' }
  ], fmtUnit);

  // 2) Penjualan vs Pembelian (Rp)
  const rpPenjualan = bulan.map(b => DB.penjualan.filter(t=>monthKey(t.tanggal)===b.key && t.status!=='pending').reduce((s,t)=>s+t.total,0));
  const rpPembelian = bulan.map(b => DB.pembelian.filter(t=>monthKey(t.tanggal)===b.key && t.status!=='pending').reduce((s,t)=>s+t.total,0));
  makeLineChart('chartPenjualanPembelian', labels, [
    { label:'Penjualan (Rp)', data: rpPenjualan, color:'#10b981' },
    { label:'Pembelian (Rp)', data: rpPembelian, color:'#e05252' }
  ], fmtRingkas);

  // 3) Piutang baru vs Hutang baru (Rp, dari transaksi kredit per bulan)
  const piutangBaru = bulan.map(b => DB.penjualan.filter(t=>monthKey(t.tanggal)===b.key && t.pembayaranTipe==='Kredit' && t.status!=='pending').reduce((s,t)=>s+t.total,0));
  const hutangBaru = bulan.map(b => DB.pembelian.filter(t=>monthKey(t.tanggal)===b.key && t.pembayaranTipe==='Kredit' && t.status!=='pending').reduce((s,t)=>s+t.total,0));
  makeLineChart('chartPiutangHutang', labels, [
    { label:'Piutang Baru (Rp)', data: piutangBaru, color:'#7c3aed' },
    { label:'Hutang Baru (Rp)', data: hutangBaru, color:'#ea580c' }
  ], fmtRingkas);

  // 4) Kas Masuk vs Kas Keluar (Rp)
  const kasMasuk = bulan.map(b => DB.kasbank.filter(k=>monthKey(k.tanggal)===b.key && k.tipe==='masuk' && k.status!=='pending').reduce((s,k)=>s+(Number(k.jumlah)||0),0));
  const kasKeluar = bulan.map(b => DB.kasbank.filter(k=>monthKey(k.tanggal)===b.key && k.tipe==='keluar' && k.status!=='pending').reduce((s,k)=>s+(Number(k.jumlah)||0),0));
  makeLineChart('chartKasMasukKeluar', labels, [
    { label:'Kas Masuk (Rp)', data: kasMasuk, color:'#0f766e' },
    { label:'Kas Keluar (Rp)', data: kasKeluar, color:'#be185d' }
  ], fmtRingkas);
}

function renderVerifikasi(){
  const pj = DB.penjualan.filter(t=>t.status==='pending').map(t=>({...t,jenis:'Penjualan',src:'penjualan'}));
  const pb = DB.pembelian.filter(t=>t.status==='pending').map(t=>({...t,jenis:'Pembelian',src:'pembelian'}));
  const kb = DB.kasbank.filter(t=>t.status==='pending').map(t=>({...t,jenis:'Kas/Bank',src:'kasbank',mitraNama:t.keterangan,total:t.jumlah}));
  const ju = DB.jurnal.filter(t=>t.status==='pending').map(t=>({...t,jenis:'Jurnal',src:'jurnal',mitraNama:t.keterangan,total:t.totalDebit}));
  const all = [...pj,...pb,...kb,...ju].sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  let rows = all.map(t=>`
    <tr><td>${fmtDate(t.tanggal)}</td><td><span class="tag tag-gold">${t.jenis}</span></td><td>${t.mitraNama||'-'}</td>
      <td class="num">${fmtIDR(t.total)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-em btn-sm" onclick="verifikasiAksi('${t.src}','${t.id}','posted')">Setujui</button>
        <button class="btn btn-red btn-sm" onclick="verifikasiAksi('${t.src}','${t.id}','ditolak')">Tolak</button>
      </td></tr>`).join('');
  if(!all.length) rows = `<tr><td colspan="5"><div class="empty-state"><div class="ic">✓</div>Tidak ada transaksi yang menunggu verifikasi.</div></td></tr>`;
  return `<div class="card"><div class="card-head"><div><h3>Antrian Verifikasi (${all.length})</h3><div class="desc">Setiap perubahan transaksi bertanggal berbeda dari hari ini wajib diverifikasi Admin atau Master sebelum diposting ke buku besar.</div></div></div>
  <table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan/Mitra</th><th>Nilai</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function verifikasiAksi(src, id, status){
  const list = DB[src];
  const item = list.find(x=>x.id===id);
  if(!item) return;
  item.status = status;
  item.diverifikasiOleh = session.user;
  // sync linked journal entries
  DB.jurnal.filter(j=>j.refType===src && j.refId===id).forEach(j=>j.status=status);
  if(status==='ditolak' && (src==='penjualan'||src==='pembelian')){
    // reverse stock if rejected
    (item.items||[]).forEach(it=>{
      const p = findProduk(it.produkId);
      if(p){ p.stok += (src==='penjualan'? it.qty : -it.qty); }
    });
  }
  await saveDB();
  toast(status==='posted' ? 'Transaksi disetujui & diposting' : 'Transaksi ditolak', status==='posted'?'ok':'err');
  buildNav(); render();
}

function hapusItemCart(i){ cartItems.splice(i,1); renderCart(); }
async function simpanPenjualan(){
  if(!cartItems.length){ toast('Tambahkan minimal 1 item','err'); return; }
  const mitraId = val('fMitra'); const mitra = findMitra(mitraId);
  const tgl = val('fTgl'); const sub = val('fSub'); const tipe = val('fTipe'); const bayar = val('fBayar');
  const total = cartItems.reduce((s,it)=>s+it.qty*it.harga,0);
  const hpp = cartItems.reduce((s,it)=>s+it.qty*it.hargaBeli,0);
  const status = autoStatus(tgl);
  const trx = { id: uid('PJ'), tanggal:tgl, mitraId, mitraNama: mitra?mitra.nama:'-', subKategori:sub,
    pembayaranTipe:tipe, metodePembayaran:bayar, items: cartItems, total, hpp, terbayar: tipe==='Kredit'?0:total, status,
    jatuhTempo: tipe==='Kredit' ? (val('fJatuhTempo')||'') : '' };
  DB.penjualan.push(trx);
  // stock movement (deduct immediately; if verification rejects later, it's reversed)
  cartItems.forEach(it=>{
    const p = findProduk(it.produkId); p.stok -= it.qty;
    addStockMovement(it.produkId, 'keluar', it.qty, tgl, 'Penjualan ke '+trx.mitraNama, 'penjualan', trx.id);
  });
  // journal: Debit Kas/Bank or Piutang, Kredit Penjualan; Debit HPP, Kredit Persediaan
  const akunMasuk = tipe==='Kredit' ? '1200' : akunDariMetode(bayar);
  postJurnal(tgl, 'Penjualan - '+trx.mitraNama, [], 'penjualan', trx.id, status);
  fixLastJurnalPenjualan(trx, akunMasuk, total, hpp);
  await saveDB(); closeModal(); toast('Transaksi penjualan tersimpan','ok'); buildNav(); render();
}
function akunDariMetode(m){
  if(m==='BANK BCA') return '1101'; if(m==='BANK BRI') return '1102'; return '1100';
}
function fixLastJurnalPenjualan(trx, akunMasuk, total, hpp){
  const j = DB.jurnal[DB.jurnal.length-1];
  j.entries = [
    {akun:akunMasuk, debit: total, kredit: 0},
    {akun:'4100', debit: 0, kredit: total},
    {akun:'5100', debit: hpp, kredit: 0},
    {akun:'1300', debit: 0, kredit: hpp}
  ];
  j.totalDebit = total + hpp; j.totalKredit = total + hpp; j.balanced = true;
}

    <td>${sisa<=0?'<span class="tag tag-green">Lunas</span>':statusTag(t.status)}</td>
    <td>${sisa>0?`<button class="btn btn-sm btn-em" onclick="modalPelunasan('pembelian','${t.id}')">Bayar</button>`:'-'}</td></tr>`;
  }).join('');
  if(!list.length) rows = `<tr><td colspan="8"><div class="empty-state">Tidak ada hutang tercatat.</div></td></tr>`;

  <table><thead><tr><th>Tanggal</th><th>Supplier</th><th>Total</th><th>Terbayar</th><th>Sisa</th><th>Jatuh Tempo</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function modalPelunasan(src, id){
  const t = DB[src].find(x=>x.id===id);
  const sisa = t.total-(t.terbayar||0);
  openModal(`<h3>Pelunasan ${src==='penjualan'?'Piutang':'Hutang'}</h3>
  <div class="desc" style="color:var(--ink-soft);font-size:12px;margin-bottom:16px">${t.mitraNama} · Sisa ${fmtIDR(sisa)}</div>
  <div class="form-grid">
    <div class="form-field"><label>Tanggal Bayar</label><input id="fTgl" type="date" value="${todayStr()}"></div>
    <div class="form-field"><label>Jumlah Bayar</label><input id="fJumlah" type="number" value="${sisa}"></div>
    <div class="form-field"><label>Melalui Akun</label><select id="fAkun"><option value="1100">Kas Tunai</option><option value="1101">Bank BCA</option><option value="1102">Bank BRI</option></select></div>
  </div>
  <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" onclick="closeModal()">Batal</button>
    <button class="btn btn-em" onclick="simpanPelunasan('${src}','${id}')">Simpan Pelunasan</button>
  </div>`);
}
async function simpanPelunasan(src, id){
  const t = DB[src].find(x=>x.id===id);
  const tgl = val('fTgl'); const jumlah = Number(val('fJumlah')); const akun = val('fAkun');
  const sisa = t.total-(t.terbayar||0);
  if(!jumlah || jumlah<=0 || jumlah>sisa+0.01){ toast('Jumlah tidak valid','err'); return; }
  t.terbayar = (t.terbayar||0) + jumlah;
  const status = autoStatus(tgl);
  const j = postJurnal(tgl, (src==='penjualan'?'Pelunasan piutang - ':'Pelunasan hutang - ')+t.mitraNama, [], src, id, status);
  j.entries = src==='penjualan' ? [{akun, debit:jumlah, kredit:0},{akun:'1200', debit:0, kredit:jumlah}]
                                  : [{akun:'2100', debit:jumlah, kredit:0},{akun, debit:0, kredit:jumlah}];
  j.totalDebit=jumlah; j.totalKredit=jumlah; j.balanced=true;
  await saveDB(); closeModal(); toast('Pelunasan tersimpan','ok'); render();
}

function renderJurnal(){

    <td><button class="btn btn-sm" onclick="lihatJurnal('${j.id}')">Detail</button></td></tr>`).join('');

  <button class="btn btn-em" onclick="modalJurnal()">+ Jurnal Manual</button></div>
  <table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Validasi</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

function lihatJurnal(id){
  const j = DB.jurnal.find(x=>x.id===id);
  const rows = j.entries.map(e=>{ const a = DB.coa.find(c=>c.kode===e.akun); return `<tr><td>${e.akun} — ${a?a.nama:''}</td><td class="num">${e.debit?fmtIDR(e.debit):''}</td><td class="num">${e.kredit?fmtIDR(e.kredit):''}</td></tr>`; }).join('');
  openModal(`<h3>Detail Jurnal</h3><div class="desc" style="color:var(--ink-soft);font-size:12px;margin-bottom:16px">${fmtDate(j.tanggal)} · ${j.keterangan}</div>
  <table><thead><tr><th>Akun</th><th>Debit</th><th>Kredit</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="balance-check ${j.balanced?'balance-ok':'balance-bad'}"><span>Total</span><span>${fmtIDR(j.totalDebit)} / ${fmtIDR(j.totalKredit)}</span></div>
  <div style="margin-top:16px;text-align:right"><button class="btn" onclick="closeModal()">Tutup</button></div>`);
}
function modalJurnal(){
  jvRows = [{akun:'',debit:0,kredit:0},{akun:'',debit:0,kredit:0}];
  openModal(`<h3>Jurnal Manual</h3><div style="height:4px"></div>
  <div class="form-grid">
    <div class="form-field"><label>Tanggal</label><input id="fTgl" type="date" value="${todayStr()}"></div>
    <div class="form-field" style="grid-column:span 2"><label>Keterangan</label><input id="fKet" placeholder="cth: Penyesuaian akhir bulan"></div>
  </div>
  <div style="margin-top:14px;font-size:12.5px;font-weight:700">Baris Jurnal</div>
  <div id="jvBody" style="margin-top:8px"></div>
  <button class="btn btn-sm" onclick="tambahBarisJurnal()">+ Baris</button>
  <div class="balance-check" id="jvBalance"></div>
  <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" onclick="closeModal()">Batal</button>
    <button class="btn btn-em" onclick="simpanJurnalManual()">Simpan Jurnal</button>
  </div>`);
  renderJV();
}
function tambahBarisJurnal(){ jvRows.push({akun:'',debit:0,kredit:0}); renderJV(); }
function renderJV(){
  document.getElementById('jvBody').innerHTML = jvRows.map((r,i)=>`
    <div class="jv-row">
      <select onchange="jvRows[${i}].akun=this.value">${['<option value="">Pilih akun</option>'].concat(DB.coa.map(a=>`<option value="${a.kode}" ${r.akun===a.kode?'selected':''}>${a.kode} - ${a.nama}</option>`)).join('')}</select>
      <input type="number" placeholder="Debit" value="${r.debit||''}" oninput="jvRows[${i}].debit=Number(this.value)||0;updateJVBalance()">
      <input type="number" placeholder="Kredit" value="${r.kredit||''}" oninput="jvRows[${i}].kredit=Number(this.value)||0;updateJVBalance()">
      <button class="btn btn-red btn-sm" onclick="jvRows.splice(${i},1);renderJV()">×</button>
    </div>`).join('');
  updateJVBalance();
}
function updateJVBalance(){
  const d = jvRows.reduce((s,r)=>s+(Number(r.debit)||0),0);
  const k = jvRows.reduce((s,r)=>s+(Number(r.kredit)||0),0);
  const el = document.getElementById('jvBalance');
  const bal = Math.abs(d-k)<0.5 && d>0;
  el.className = 'balance-check ' + (bal?'balance-ok':'balance-bad');
  el.innerHTML = `<span>Total Debit: ${fmtIDR(d)} &nbsp;|&nbsp; Total Kredit: ${fmtIDR(k)}</span><span>${bal?'✓ Seimbang':'✗ Belum Seimbang'}</span>`;
}
async function simpanJurnalManual(){
  const tgl = val('fTgl'); const ket = val('fKet');
  const d = jvRows.reduce((s,r)=>s+(Number(r.debit)||0),0);
  const k = jvRows.reduce((s,r)=>s+(Number(r.kredit)||0),0);
  if(!ket){ toast('Keterangan wajib diisi','err'); return; }
  if(Math.abs(d-k)>=0.5 || d<=0 || jvRows.some(r=>!r.akun)){ toast('Debit harus sama dengan Kredit dan semua akun terisi','err'); return; }
  postJurnal(tgl, ket, jvRows.map(r=>({akun:r.akun,debit:r.debit,kredit:r.kredit})), 'manual', uid('MAN'));
  await saveDB(); closeModal(); toast('Jurnal manual tersimpan','ok'); buildNav(); render();
}

/* ===================== NERACA & LABA RUGI ===================== */
function renderNeraca(){
  const aset = DB.coa.filter(a=>a.tipe==='Aset').map(a=>({...a,saldo:saldoAkun(a.kode)}));
  const kewajiban = DB.coa.filter(a=>a.tipe==='Kewajiban').map(a=>({...a,saldo:-saldoAkun(a.kode)}));
  const modal = DB.coa.filter(a=>a.tipe==='Modal').map(a=>({...a,saldo:-saldoAkun(a.kode)}));
  const totalAset = aset.reduce((s,a)=>s+a.saldo,0);
  const labaBerjalan = hitungLabaRugi().labaBersih;
  const totalKewajiban = kewajiban.reduce((s,a)=>s+a.saldo,0);
  const totalModal = modal.reduce((s,a)=>s+a.saldo,0) + labaBerjalan;
  const balanced = Math.abs(totalAset-(totalKewajiban+totalModal))<1;
  const sect = (title,list)=>`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px">${title}</div>
    ${list.map(a=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${a.nama}</span><span class="num">${fmtIDR(a.saldo)}</span></div>`).join('')}</div>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="form-grid">
    <div class="card">${sect('Aset',aset)}<div style="display:flex;justify-content:space-between;font-weight:800;padding-top:6px"><span>Total Aset</span><span class="num">${fmtIDR(totalAset)}</span></div></div>
    <div class="card">${sect('Kewajiban',kewajiban)}${sect('Modal',modal.concat([{nama:'Laba Berjalan',saldo:labaBerjalan}]))}
    <div style="display:flex;justify-content:space-between;font-weight:800;padding-top:6px"><span>Total Kewajiban + Modal</span><span class="num">${fmtIDR(totalKewajiban+totalModal)}</span></div></div>
  </div>
  <div class="balance-check ${balanced?'balance-ok':'balance-bad'}" style="max-width:100%"><span>Status Neraca</span><span>${balanced?'✓ Seimbang (Aset = Kewajiban + Modal)':'✗ Tidak Seimbang — periksa jurnal'}</span></div>`;
}
function hitungLabaRugi(){
  const pendapatan = DB.coa.filter(a=>a.tipe==='Pendapatan').map(a=>({...a,saldo:-saldoAkun(a.kode)}));
  const beban = DB.coa.filter(a=>a.tipe==='Beban').map(a=>({...a,saldo:saldoAkun(a.kode)}));
  const totalPendapatan = pendapatan.reduce((s,a)=>s+a.saldo,0);
  const totalBeban = beban.reduce((s,a)=>s+a.saldo,0);
  return {pendapatan, beban, totalPendapatan, totalBeban, labaBersih: totalPendapatan-totalBeban};
}
function renderLabaRugi(){
  const {pendapatan,beban,totalPendapatan,totalBeban,labaBersih} = hitungLabaRugi();
  return `<div class="card">
    <div style="font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--ink-soft);text-transform:uppercase">Pendapatan</div>
    ${pendapatan.map(a=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${a.nama}</span><span class="num">${fmtIDR(a.saldo)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;font-weight:700;padding:8px 0"><span>Total Pendapatan</span><span class="num">${fmtIDR(totalPendapatan)}</span></div>
    <div style="font-weight:700;font-size:12.5px;margin:14px 0 6px;color:var(--ink-soft);text-transform:uppercase">Beban</div>
    ${beban.map(a=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${a.nama}</span><span class="num">${fmtIDR(a.saldo)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;font-weight:700;padding:8px 0"><span>Total Beban</span><span class="num">${fmtIDR(totalBeban)}</span></div>
    <div class="balance-check ${labaBersih>=0?'balance-ok':'balance-bad'}"><span>${labaBersih>=0?'Laba Bersih':'Rugi Bersih'}</span><span>${fmtIDR(Math.abs(labaBersih))}</span></div>
  </div>`;
}

/* ===================== PENYUSUTAN & PAJAK (dasar) ===================== */
function renderPenyusutan(){
  const {labaBersih} = hitungLabaRugi();
  const asetTetap = saldoAkun('1500');
  const estimasiPenyusutanTahunan = asetTetap * 0.10; // garis lurus 10%/tahun, dasar
  const pajakEstimasi = Math.max(labaBersih,0) * 11; // estimasi PPh Final UMKM 0.5%, dasar
  return `<div class="card"><div class="card-head"><div><h3>Dasar Penyusutan</h3><div class="desc">Metode garis lurus, estimasi 10%/tahun — sesuaikan kebijakan perusahaan</div></div></div>

    <div class="kpi-card"><div class="accent" style="background:var(--gold)"></div><div class="lbl">Estimasi Penyusutan/Tahun</div><div class="val num">${fmtIDR(estimasiPenyusutanTahunan)}</div></div>
  </div></div>
  <div class="card"><div class="card-head"><div><h3>Dasar Pajak</h3><div class="desc">Estimasi PPh Final 0,5% dari laba bersih berjalan (UMKM) — bersifat indikatif, bukan pengganti konsultasi pajak resmi</div></div></div>
  <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)">

/* ===================== RIWAYAT TRANSAKSI ===================== */
function renderRiwayat(){
  const all = [
    ...DB.penjualan.map(t=>({tgl:t.tanggal,jenis:'Penjualan',ket:t.mitraNama,nilai:t.total,status:t.status})),
    ...DB.pembelian.map(t=>({tgl:t.tanggal,jenis:'Pembelian',ket:t.mitraNama,nilai:t.total,status:t.status})),

    ...DB.produksi.map(t=>({tgl:t.tanggal,jenis:'Produksi',ket:t.produkJadiNama,nilai:t.qtyJadi,status:t.status})),
    ...DB.jurnal.map(t=>({tgl:t.tanggal,jenis:'Jurnal',ket:t.keterangan,nilai:t.totalDebit,status:t.status})),

/* ===================== PENGATURAN (master) ===================== */
function renderPengaturan(){
  if(session.role!=='master') return guardMaster();
  const allNavs = NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly);
  const daftarAdmin = [
    ['fitri','Fitri'],['riska','Riska'],['orhan','Orhan'],['siti','Siti'],['abah','Abah']
  ];
  const userCard = (username,label) => {
    const user=DB.users[username] || {permissions:null};
    const activePerm=user.permissions || allNavs.map(i=>i.id);
    const checks=allNavs.map(it=>`<label class="checkbox-item"><input type="checkbox" id="chk_${username}_${it.id}" ${activePerm.includes(it.id)?'checked':''}> ${it.label}</label>`).join('');
    return `<div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Hak Akses ${label} <span class="tag tag-green">${username}</span></h3><div class="desc">Centang menu yang boleh dilihat dan diakses akun ${label}.</div></div></div><div class="form-field" style="max-width:360px;margin-bottom:14px"><label>Password Baru ${label}</label><input id="p_${username}" type="password" placeholder="Kosongkan jika tidak diubah"></div><div class="checkbox-grid">${checks}</div></div>`;
  };
  return `<div class="card"><div class="card-head"><div><h3>Pengguna, Password &amp; Hak Akses</h3><div class="desc">Owner dapat mengatur 5 akun Admin secara terpisah tanpa me-refresh halaman. Semua akun tetap menggunakan database ERP yang sama.</div></div></div><div class="form-grid">${daftarAdmin.map(([u,l])=>`<div class="form-field"><label>Username ${l}</label><input value="${u}" readonly></div>`).join('')}<div class="form-field"><label>Username Owner</label><input value="owner" readonly></div></div></div>${daftarAdmin.map(([u,l])=>userCard(u,l)).join('')}<div style="margin-top:16px"><button class="btn btn-em" onclick="simpanPengaturan()">Simpan Pengaturan &amp; Hak Akses Semua Admin</button></div>`;
}
async function simpanPengaturan(){
  const allNavs=NAV.flatMap(g=>g.items).filter(i=>!i.masterOnly);
  const admins=['fitri','riska','orhan','siti','abah'];
  admins.forEach(username=>{
    const p=val('p_'+username); if(p) DB.users[username].password=p;
    DB.users[username].permissions=allNavs.filter(it=>{const chk=document.getElementById('chk_'+username+'_'+it.id); return chk && chk.checked;}).map(it=>it.id);
  });
  await saveDB(); toast('Pengaturan semua Admin berhasil disimpan tanpa refresh halaman','ok');
  admins.forEach(u=>{const el=document.getElementById('p_'+u); if(el) el.value='';});
  buildNav(); render();
}

function editTransaksiMaster(coll, id){
  if(session.role!=='master'){ toast('Hanya Master yang dapat mengubah transaksi','err'); return; }
  const item = DB[coll].find(x=>x.id===id);
  if(!item) return;

  openModal(`<h3>Edit Transaksi (${coll})</h3><div class="desc" style="color:var(--ink-soft);font-size:12px;margin-bottom:16px">Hanya tanggal &amp; keterangan yang dapat diubah demi menjaga jejak audit nilai/item asli.</div>

  </div>

async function simpanEditTransaksi(coll, id, ketField){
  const item = DB[coll].find(x=>x.id===id);
  if(!item) return;
  const tglBaru = val('eTgl'), ketBaru = val('eKet');
  item.tanggal = tglBaru; item[ketField] = ketBaru;
  DB.jurnal.filter(j=>j.refType===coll && j.refId===id).forEach(j=>{ j.tanggal = tglBaru; });
  await saveDB(); closeModal(); toast('Transaksi diperbarui','ok'); render();
}
async function hapusTransaksiMaster(coll, id){
  if(session.role!=='master'){ toast('Hanya Master yang dapat menghapus transaksi','err'); return; }
  if(!confirm('Hapus transaksi ini? Stok dan jurnal terkait akan dibalikkan.')) return;
  const item = DB[coll].find(x=>x.id===id);
  if(!item) return;
  // reverse stock effects
  if((coll==='penjualan'||coll==='pembelian') && item.items){
    item.items.forEach(it=>{
      const p = findProduk(it.produkId);
      if(p){ p.stok += (coll==='penjualan'? it.qty : -it.qty); }
    });
  }
  if(coll==='produksi'){
    item.bahan.forEach(b=>{ const p=findProduk(b.produkId); if(p) p.stok += b.qty; });
    const jadi = findProduk(item.produkJadiId); if(jadi) jadi.stok -= item.qtyJadi;
  }
  // remove linked journal entries and the item itself
  DB.jurnal = DB.jurnal.filter(j=>!(j.refType===coll && j.refId===id) && j.id!==id);
  DB.stockMovement = DB.stockMovement.filter(s=>!(s.refType===coll && s.refId===id));
  DB[coll] = DB[coll].filter(x=>x.id!==id);
  await saveDB(); toast('Transaksi dihapus & dibalikkan','ok'); buildNav(); render();
}

/* ===================== ANALISA DATA OTOMATIS ===================== */
const ANALISA_PERIOD = { type:'month', start:null, end:null };
const PRINT_COMPANY_NAME = 'PT. MADANI GLOBAL MANAGMENT';
let analysisCache = null;

function safeText(v){ return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function num(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function parseDateSafe(v){
  if(!v) return null;
  const s=String(v).slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const d=new Date(s+'T00:00:00');
  return Number.isNaN(d.getTime())?null:d;
}
function analysisRange(){
  const now=new Date(); now.setHours(0,0,0,0);
  let start=new Date(now), end=new Date(now);
  const type=ANALISA_PERIOD.type||'month';
  if(type==='today'){}
  else if(type==='7d'){ start.setDate(now.getDate()-6); }
  else if(type==='month') start=new Date(now.getFullYear(),now.getMonth(),1);
  else if(type==='prevmonth'){ start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(type==='3m'){ start=new Date(now.getFullYear(),now.getMonth()-2,1); }
  else if(type==='6m'){ start=new Date(now.getFullYear(),now.getMonth()-5,1); }
  else if(type==='year'){ start=new Date(now.getFullYear(),0,1); }
  else if(type==='custom'){
    const a=parseDateSafe(ANALISA_PERIOD.start), b=parseDateSafe(ANALISA_PERIOD.end);
    if(a) start=a; if(b) end=b;
    if(start>end){ const t=start; start=end; end=t; }
  }
  return {start,end};
}
function inAnalysisPeriod(date){ const d=parseDateSafe(date); if(!d)return false; const r=analysisRange(); return d>=r.start&&d<=r.end; }
function periodLabel(){ const r=analysisRange(); return `${fmtDate(r.start.toISOString().slice(0,10))} s/d ${fmtDate(r.end.toISOString().slice(0,10))}`; }
function filteredRows(arr){ return (Array.isArray(arr)?arr:[]).filter(x=>inAnalysisPeriod(x.tanggal||x.tgl||x.date)); }
function analysisTransactions(){
  const penjualan=filteredRows(DB.penjualan), pembelian=filteredRows(DB.pembelian), kasbank=filteredRows(DB.kasbank), jurnal=filteredRows(DB.jurnal), produksi=filteredRows(DB.produksi), stockMovement=filteredRows(DB.stockMovement);
  return {penjualan,pembelian,kasbank,jurnal,produksi,stockMovement};
}
function journalTotals(rows){
  let debit=0,kredit=0; rows.forEach(j=>{ debit+=num(j.totalDebit); kredit+=num(j.totalKredit); });
  return {debit,kredit};
}
function accountPeriodBalance(kode, rows){
  let s=0; rows.forEach(j=>(j.entries||[]).forEach(e=>{ if(String(e.akun)===String(kode)) s+=num(e.debit)-num(e.kredit); })); return s;
}
function accountName(kode){ const a=(DB.coa||[]).find(x=>String(x.kode)===String(kode)); return a?a.nama:kode; }
function financialFromJournals(rows){
  let pend=0,beban=0;
  (DB.coa||[]).filter(a=>a.tipe==='Pendapatan').forEach(a=>pend += -accountPeriodBalance(a.kode,rows));
  (DB.coa||[]).filter(a=>a.tipe==='Beban').forEach(a=>beban += accountPeriodBalance(a.kode,rows));
  return {totalPendapatan:pend,totalBeban:beban,labaBersih:pend-beban,margin:pend?((pend-beban)/pend*100):null};
}
function receivableRows(rows){ return rows.filter(t=>t.pembayaranTipe==='Kredit').map(t=>({...t,sisa:Math.max(0,num(t.total)-num(t.terbayar))})); }
function payableRows(rows){ return rows.filter(t=>t.pembayaranTipe==='Kredit').map(t=>({...t,sisa:Math.max(0,num(t.total)-num(t.terbayar))})); }
function overdue(row){ const d=parseDateSafe(row.jatuhTempo); const today=parseDateSafe(todayStr()); return !!(d&&today&&d<today&&num(row.sisa)>0); }
function stockStatus(p){
  const stok=num(p.stok), min=num(p.stokMin);
  if(stok<=0)return ['KOSONG','tag-red'];
  if(stok<=min/2)return ['KRITIS','tag-red'];
  if(stok<=min)return ['MENIPIS','tag-gold'];
  return ['AMAN','tag-green'];
}
function productAnalysis(rows){
  const map={};
  rows.forEach(t=>(t.items||[]).forEach(it=>{
    const id=it.produkId||it.id||it.nama; const p=findProduk(id)||{}; const k=id||it.nama;
    if(!map[k]) map[k]={id:k,nama:it.nama||p.nama||'-',qty:0,nilai:0,hargaBeli:num(it.hargaBeli||p.hargaBeli),hargaJual:num(it.harga||p.hargaJual)};
    map[k].qty+=num(it.qty); map[k].nilai+=num(it.qty)*num(it.harga); if(!map[k].hargaBeli)map[k].hargaBeli=num(p.hargaBeli);
    if(!map[k].hargaJual)map[k].hargaJual=num(p.hargaJual);
  }));
  return Object.values(map).map(x=>{ const margin=(x.hargaJual||0)-(x.hargaBeli||0); return {...x,margin,marginPct:x.hargaJual?margin/x.hargaJual*100:null,stok:num((findProduk(x.id)||{}).stok),stokMin:num((findProduk(x.id)||{}).stokMin)}; });
}
function compareMonths(rows){

<script>
// Fitur Prioritas 2 & 6: Tombol WhatsApp Pintar
function formatWA(kontak, nama, ket) {
  if(!kontak) return '-';
  let num = kontak.replace(/\D/g, '');
  if(num.startsWith('0')) num = '62' + num.slice(1);
  if(num.length < 9) return kontak;
  let text = encodeURIComponent(`Halo ${nama}, ${ket || 'terkait sistem PT. MADANI GLOBAL MANAGMENT...'}`);
  return `${kontak} <a href="https://wa.me/${num}?text=${text}" target="_blank" class="btn btn-sm btn-wa" style="margin-left:6px;text-decoration:none;">💬 WhatsApp</a>`;
}
// Fitur Prioritas 1 & 5: Notifikasi MP3 tiap 5 menit jika ada unread
function playNotifSound(){
  const audio = document.getElementById('notifAudio');
  audio.play().catch(()=>{
    try{ // Fallback beep
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
      o.start(ctx.currentTime); o.stop(ctx.currentTime+0.18);
    }catch(e){}
  });
}
function startNotifChime(){
  if(notifTimer) clearInterval(notifTimer);
  notifTimer = setInterval(()=>{
    const n = getNotifItems();
    if(n.length){ playNotifSound(); toast('🔔 Ada '+n.length+' notifikasi belum dibuka','err'); }
  }, 300000); // 5 Menit (300000ms)
}
</script>

<script>
function updateGreeting() {
    // Mengambil waktu Indonesia Barat (WIB / UTC+7)
    const now = new Date();

    const wibTime = new Date(
        now.toLocaleString("en-US", {
            timeZone: "Asia/Jakarta"
        })
    );

    const hour = wibTime.getHours();

    let greeting;

    if (hour >= 4 && hour < 11) {
        greeting = "Selamat Pagi";
    } else if (hour >= 11 && hour < 15) {
        greeting = "Selamat Siang";
    } else if (hour >= 15 && hour < 18) {
        greeting = "Selamat Sore";
    } else {
        greeting = "Selamat Malam";
    }

    document.getElementById("greeting").textContent =
        "Hallo ka, " + greeting;
}

// Jalankan saat halaman dibuka
updateGreeting();

// Perbarui setiap 1 menit
